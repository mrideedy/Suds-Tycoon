<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Suds Tycoon</title>
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#2563eb">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Ccircle cx='32' cy='32' r='28' fill='%2359c2ff' stroke='%23172338' stroke-width='4'/%3E%3Ccircle cx='23' cy='22' r='8' fill='%23fff'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lilita+One&family=Nunito:wght@700;800;900&family=Permanent+Marker&display=swap">
<style>
/* Layout: full-bleed WebGL car-wash lot; HUD pinned to the corners like a mobile idle game,
   upgrade cards in a tray at the bottom, a 50px banner-ad strip below them. */
:root {
  --ink: #12233d;          /* navy text on white cards */
  --ink-soft: #5b6b85;
  --card: #ffffff;
  --card-soft: #eef3fb;
  --pill: rgba(12, 24, 44, 0.62);
  --brand: #2563eb;
  --brand-dark: #1a46b8;
  --cash: #46c23a;
  --cash-dark: #2a8f1f;
  --gem: #b44cff;
  --gold: #ffc92e;
  --gold-dark: #d48f00;
  --danger: #ff4d5a;
  --sky: #9fd9ff;
  --grass: #7cc850;
  --font-display: 'Lilita One', 'Arial Rounded MT Bold', 'Trebuchet MS', system-ui, sans-serif;
  --font-body: 'Nunito', 'Segoe UI', system-ui, -apple-system, sans-serif;
  --safe-t: env(safe-area-inset-top, 0px);
  --safe-b: env(safe-area-inset-bottom, 0px);
  --safe-l: env(safe-area-inset-left, 0px);
  --safe-r: env(safe-area-inset-right, 0px);
  --banner-h: 0px;
  color-scheme: light;
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
[hidden] { display: none !important; }
html, body { height: 100%; margin: 0; }
body {
  background: var(--grass);
  color: var(--ink);
  font-family: var(--font-body);
  overflow: hidden;
  overscroll-behavior: none;
  touch-action: none;
  user-select: none;
  -webkit-user-select: none;
}
#app { position: fixed; inset: 0; overflow: hidden; background: var(--sky); }
#stage { position: absolute; inset: 0; }
#stage canvas { display: block; width: 100%; height: 100%; outline: none; }
#labels { position: absolute; inset: 0; pointer-events: none; overflow: hidden; z-index: 2; }
button { font: inherit; color: inherit; border: 0; background: none; padding: 0; cursor: pointer; }
button:focus-visible { outline: 3px solid #fff; outline-offset: 2px; }
.ico { display: inline-block; line-height: 0; }
.ico svg { width: 100%; height: 100%; display: block; }
.num { font-family: var(--font-display); font-variant-numeric: tabular-nums; letter-spacing: .3px; }
.outline { color: #fff; -webkit-text-stroke: 1px rgba(10, 20, 40, .55); paint-order: stroke fill; text-shadow: 0 2px 0 rgba(0, 0, 0, .35); }

/* ---------------- HUD ---------------- */
#hud { position: absolute; inset: 0; pointer-events: none; z-index: 5; font-family: var(--font-display); }
#hud > * { pointer-events: auto; }
.hud-tl { position: absolute; left: calc(10px + var(--safe-l)); top: calc(8px + var(--safe-t)); display: flex; flex-direction: column; gap: 8px; align-items: flex-start; pointer-events: none; }
.hud-tl > * { pointer-events: auto; }
.lvl-row { display: flex; align-items: center; }
.lvl-badge { position: relative; width: 62px; height: 62px; z-index: 2; filter: drop-shadow(0 3px 0 rgba(0,0,0,.25)); }
.lvl-badge .ico { width: 62px; height: 62px; }
.lvl-badge span { position: absolute; inset: 0; display: grid; place-items: center; font-size: 26px; color: #fff; -webkit-text-stroke: 1.5px #8a4b00; paint-order: stroke fill; padding-top: 2px; }
.xp-bar { margin-left: -16px; height: 34px; min-width: 150px; padding: 0 16px 0 24px; border-radius: 18px; background: var(--pill); position: relative; overflow: hidden; display: flex; align-items: center; box-shadow: inset 0 2px 4px rgba(0,0,0,.25); }
.xp-fill { position: absolute; left: 0; top: 0; bottom: 0; width: 30%; background: linear-gradient(#59a8ff, #2563eb); border-radius: 18px; transition: width .4s; }
.xp-text { position: relative; font-size: 18px; color: #fff; text-shadow: 0 2px 0 rgba(0,0,0,.35); margin-left: auto; }

.quest { display: flex; align-items: center; gap: 8px; width: 238px; padding: 7px 10px 7px 7px; background: rgba(255,255,255,.94); border-radius: 16px; box-shadow: 0 3px 0 rgba(10,30,60,.18), 0 6px 14px rgba(10,30,60,.18); font-family: var(--font-body); }
.quest .q-ico { width: 38px; height: 38px; flex: 0 0 38px; border-radius: 12px; background: var(--card-soft); display: grid; place-items: center; }
.quest .q-ico .ico { width: 30px; height: 30px; }
.quest .q-body { flex: 1; min-width: 0; }
.quest .q-text { font-weight: 900; font-size: 13px; line-height: 1.15; color: var(--ink); }
.quest .q-prog { margin-top: 4px; height: 8px; border-radius: 6px; background: #dfe6f2; overflow: hidden; }
.quest .q-prog > div { height: 100%; width: 0; background: linear-gradient(90deg, #46c23a, #8fe27a); border-radius: 6px; transition: width .3s; }
.quest .q-reward { display: flex; gap: 4px; align-items: center; font-family: var(--font-display); font-size: 13px; color: var(--ink-soft); margin-top: 3px; }
.quest .q-reward .ico { width: 15px; height: 15px; }
.quest .q-claim { display: none; }
.quest.done { animation: questPulse 1s infinite; cursor: pointer; }
.quest.done .q-claim { display: block; background: linear-gradient(#5fd94e, #34b528); color: #fff; font-family: var(--font-display); font-size: 15px; padding: 8px 10px; border-radius: 12px; box-shadow: inset 0 -3px 0 rgba(0,0,0,.18); }
@keyframes questPulse { 50% { transform: scale(1.04); } }

.hud-tr { position: absolute; right: calc(10px + var(--safe-r)); top: calc(10px + var(--safe-t)); display: flex; gap: 10px; align-items: center; }
.cur-pill { position: relative; height: 38px; display: flex; align-items: center; padding: 0 4px 0 36px; border-radius: 20px; background: var(--pill); box-shadow: inset 0 2px 4px rgba(0,0,0,.25); min-width: 120px; }
.cur-pill > .ico { position: absolute; left: -12px; top: 50%; transform: translateY(-50%); width: 46px; height: 46px; filter: drop-shadow(0 2px 0 rgba(0,0,0,.3)); }
.cur-pill .val { font-size: 21px; color: #fff; text-shadow: 0 2px 0 rgba(0,0,0,.35); flex: 1; text-align: center; padding: 0 6px; }
.cur-pill.bump .val { animation: bump .25s; }
@keyframes bump { 50% { transform: scale(1.18); } }
.plus-btn { width: 34px; height: 30px; border-radius: 10px; background: linear-gradient(#63de52, #2fae24); box-shadow: inset 0 -3px 0 rgba(0,0,0,.2), 0 2px 0 rgba(0,0,0,.2); display: grid; place-items: center; }
.plus-btn .ico { width: 20px; height: 20px; }
.gear-btn { width: 50px; height: 50px; border-radius: 50%; background: linear-gradient(#3d7bff, #1d4fc4); border: 3px solid #fff; box-shadow: 0 3px 0 rgba(0,0,0,.25); display: grid; place-items: center; }
.gear-btn .ico { width: 30px; height: 30px; }

.side { position: absolute; top: calc(150px + var(--safe-t)); display: flex; flex-direction: column; gap: 10px; }
.side.left { left: calc(10px + var(--safe-l)); }
.side.right { right: calc(10px + var(--safe-r)); top: calc(66px + var(--safe-t)); align-items: flex-end; }
.side-btn { position: relative; width: 58px; display: flex; flex-direction: column; align-items: center; gap: 1px; }
.side-btn .disc { width: 54px; height: 54px; border-radius: 18px; background: linear-gradient(#ffffff, #e6eefb); box-shadow: 0 3px 0 rgba(10,30,60,.25), 0 6px 12px rgba(10,30,60,.2); display: grid; place-items: center; }
.side-btn .disc .ico { width: 38px; height: 38px; }
.side-btn .lbl { font-size: 12px; color: #fff; -webkit-text-stroke: 1px rgba(10,20,40,.6); paint-order: stroke fill; text-shadow: 0 2px 0 rgba(0,0,0,.3); white-space: nowrap; }
.side-btn .dot { position: absolute; top: -4px; right: -2px; min-width: 22px; height: 22px; padding: 0 5px; border-radius: 11px; background: var(--danger); color: #fff; font-size: 13px; display: grid; place-items: center; border: 2px solid #fff; }
.side-btn.locked .disc { filter: grayscale(1) brightness(.85); }
.side-btn .lock { position: absolute; top: 30px; right: 0; width: 24px; height: 24px; display: none; }
.side-btn.locked .lock { display: block; }
.side-btn.attn .disc { animation: wiggle 1.6s infinite; }
@keyframes wiggle { 0%, 70%, 100% { transform: rotate(0); } 75% { transform: rotate(-8deg); } 85% { transform: rotate(8deg); } 95% { transform: rotate(-4deg); } }
.boost-btn { position: relative; display: flex; align-items: center; gap: 6px; padding: 5px 10px 5px 5px; border-radius: 16px; background: rgba(255,255,255,.94); box-shadow: 0 3px 0 rgba(10,30,60,.22); }
.boost-btn .disc { width: 40px; height: 40px; border-radius: 12px; display: grid; place-items: center; background: var(--card-soft); }
.boost-btn .disc .ico { width: 32px; height: 32px; }
.boost-btn .b-txt { font-size: 15px; color: var(--ink); line-height: 1; }
.boost-btn .b-sub { display: flex; align-items: center; gap: 3px; font-size: 12px; color: var(--ink-soft); margin-top: 3px; font-family: var(--font-display); }
.boost-btn .b-sub .ico { width: 16px; height: 16px; }
.boost-btn.active { background: linear-gradient(#fff7d6, #ffe68a); }
.boost-btn.active .b-sub { color: #9a5a00; }

#streak { position: absolute; top: calc(10px + var(--safe-t)); left: 50%; transform: translateX(-50%); display: none; align-items: center; gap: 6px; padding: 6px 14px; border-radius: 18px; background: linear-gradient(#ff9a3c, #ff5a3c); color: #fff; font-size: 16px; box-shadow: 0 3px 0 rgba(0,0,0,.2); white-space: nowrap; }
#streak.on { display: flex; }
#streak .ico { width: 20px; height: 20px; }
#event-banner { position: absolute; top: calc(58px + var(--safe-t)); left: 50%; transform: translateX(-50%) scale(0); padding: 10px 22px; border-radius: 20px; background: linear-gradient(#ff5a8a, #e8383d); color: #fff; font-size: 24px; white-space: nowrap; box-shadow: 0 4px 0 rgba(0,0,0,.25); transition: transform .3s cubic-bezier(.3,1.6,.5,1); text-align: center; }
#event-banner small { display: block; font-size: 14px; opacity: .95; }
#event-banner.on { transform: translateX(-50%) scale(1); }

/* bottom upgrade cards (like the reference) */
.cards-wrap { position: absolute; left: 0; right: 0; bottom: calc(var(--banner-h) + 8px + var(--safe-b)); display: flex; justify-content: center; pointer-events: none; }
.cards { display: flex; gap: 12px; padding: 6px 14px 8px; overflow-x: auto; scrollbar-width: none; pointer-events: auto; max-width: 100%; }
.cards::-webkit-scrollbar { display: none; }
.ucard { position: relative; flex: 0 0 auto; width: 214px; display: grid; grid-template-columns: 58px 1fr; grid-template-rows: auto auto; column-gap: 8px; padding: 10px 12px 10px 10px; border-radius: 20px; background: #fff; box-shadow: 0 4px 0 rgba(10,30,60,.18), 0 8px 18px rgba(10,30,60,.2); border: 3px solid #fff; }
.ucard .u-ico { grid-row: 1 / span 2; width: 58px; height: 58px; display: grid; place-items: center; }
.ucard .u-ico .ico { width: 54px; height: 54px; }
.ucard .u-name { font-size: 18px; color: var(--ink); line-height: 1.05; align-self: end; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.ucard .u-lv { font-family: var(--font-body); font-weight: 900; font-size: 13px; color: var(--ink-soft); align-self: start; }
.ucard .buy { grid-column: 1 / span 2; margin-top: 8px; height: 40px; border-radius: 14px; background: linear-gradient(#63de52, #2fae24); box-shadow: inset 0 -4px 0 rgba(0,0,0,.18), 0 2px 0 rgba(0,0,0,.15); color: #fff; font-family: var(--font-display); font-size: 21px; display: flex; align-items: center; justify-content: center; gap: 6px; text-shadow: 0 2px 0 rgba(0,0,0,.25); }
.ucard .buy .ico { width: 30px; height: 30px; }
.ucard.poor .buy { background: linear-gradient(#b9c2d0, #9aa5b6); }
.ucard.max .buy { background: linear-gradient(#ffd84a, #f0a800); }
.ucard.free .buy { background: linear-gradient(#b56bff, #8a2be2); }
.ucard .tag { position: absolute; top: -10px; right: 10px; padding: 2px 8px; border-radius: 9px; font-size: 12px; color: #fff; background: var(--danger); box-shadow: 0 2px 0 rgba(0,0,0,.2); }
.ucard .tag.slow { background: #ff8a1f; }
.ucard:active { transform: translateY(2px); }
.ucard.flash { animation: cardFlash .35s; }
@keyframes cardFlash { 40% { transform: scale(1.06); box-shadow: 0 0 0 6px rgba(76,193,58,.5); } }

/* ---------------- world labels ---------------- */
.wlabel { position: absolute; left: 0; top: 0; will-change: transform; white-space: nowrap; font-family: var(--font-display); }
.ftext { position: absolute; left: 0; top: 0; will-change: transform, opacity; white-space: nowrap; font-family: var(--font-display); font-size: 24px; color: #fff; -webkit-text-stroke: 1.5px rgba(10,30,20,.65); paint-order: stroke fill; text-shadow: 0 3px 0 rgba(0,0,0,.3); animation: pop .3s cubic-bezier(.3,1.8,.5,1); }
.ftext.cash { color: #b6ff9a; -webkit-text-stroke-color: #1d5a12; }
.ftext.tip { color: #ffe36b; -webkit-text-stroke-color: #7a4a00; font-size: 20px; }
.ftext.big { font-size: 34px; color: #fff; -webkit-text-stroke: 2px #1a46b8; }
.ftext.rage { font-size: 30px; color: #ff5a5a; -webkit-text-stroke: 2px #5a0a0a; }
.ftext.xp { color: #9fd0ff; -webkit-text-stroke-color: #12326e; font-size: 18px; }
.ftext.gem { color: #e7b6ff; -webkit-text-stroke-color: #4a1070; }
.ftext.honk { font-size: 20px; color: #ffd23f; -webkit-text-stroke: 1.5px #5a3a00; }
.ftext.new { font-size: 26px; color: #ffd23f; -webkit-text-stroke: 2px #7a3a00; }
.ftext .ico { width: 1.1em; height: 1.1em; vertical-align: -0.2em; }
@keyframes pop { from { scale: .3; } }
.face { width: 34px; height: 34px; filter: drop-shadow(0 2px 0 rgba(0,0,0,.25)); }
.face .ico { width: 100%; height: 100%; }
.mood { display: flex; flex-direction: column; align-items: center; gap: 2px; }
.mood .pbar { width: 40px; height: 6px; border-radius: 3px; background: rgba(0,0,0,.35); overflow: hidden; }
.mood .pbar > div { height: 100%; background: #46c23a; }
.say { max-width: 170px; white-space: normal; text-align: center; font-family: var(--font-body); font-weight: 900; font-size: 12px; line-height: 1.15; color: var(--ink); background: #fff; padding: 6px 9px; border-radius: 12px; box-shadow: 0 2px 0 rgba(0,0,0,.2); position: relative; margin-bottom: 6px; }
.say::after { content: ''; position: absolute; left: 50%; bottom: -6px; margin-left: -6px; border: 6px solid transparent; border-top-color: #fff; border-bottom: 0; }
.st-badge { display: flex; align-items: center; gap: 4px; padding: 4px 9px 4px 4px; border-radius: 14px; background: #ff4d5a; color: #fff; font-size: 14px; box-shadow: 0 2px 0 rgba(0,0,0,.25); animation: bob 1s infinite ease-in-out; }
.st-badge .ico { width: 22px; height: 22px; }
.st-badge.warn { background: #ff8a1f; }
.st-badge.info { background: #2563eb; }
@keyframes bob { 50% { transform: translateY(-5px); } }
.ring-prog { width: 40px; height: 40px; }
.hopper-lbl { display: flex; align-items: center; gap: 3px; padding: 2px 7px 2px 3px; border-radius: 12px; background: rgba(12,24,44,.7); color: #fff; font-size: 14px; }
.hopper-lbl .ico { width: 20px; height: 20px; }
.hopper-lbl.low { background: #ff4d5a; }
.zzz { font-size: 22px; color: #fff; -webkit-text-stroke: 1.5px #3a4a7a; paint-order: stroke fill; animation: zz 1.4s infinite; }
@keyframes zz { 0% { transform: translate(0,0) scale(.8); opacity: .3; } 50% { opacity: 1; } 100% { transform: translate(14px,-16px) scale(1.15); opacity: 0; } }
.name-tag { font-family: var(--font-body); font-weight: 900; font-size: 11px; color: #fff; background: rgba(12,24,44,.6); padding: 1px 7px; border-radius: 8px; }
.carry-cnt { font-size: 15px; color: #fff; -webkit-text-stroke: 1px rgba(0,0,0,.6); paint-order: stroke fill; }
.carry-cnt.max { color: #ffd23f; }
.pile-lbl { display: flex; align-items: center; gap: 3px; font-size: 18px; color: #b6ff9a; -webkit-text-stroke: 1.5px #1d5a12; paint-order: stroke fill; text-shadow: 0 2px 0 rgba(0,0,0,.25); }
.pile-lbl .ico { width: 24px; height: 24px; }
.mat-lbl { padding: 3px 9px; border-radius: 10px; background: rgba(255,255,255,.92); color: var(--brand-dark); font-size: 13px; box-shadow: 0 2px 0 rgba(0,0,0,.18); }
.gift-tag { display: flex; align-items: center; gap: 4px; padding: 3px 9px 3px 3px; border-radius: 14px; background: #fff; color: var(--ink); font-size: 14px; box-shadow: 0 2px 0 rgba(0,0,0,.25); pointer-events: auto; cursor: pointer; animation: bob 1s infinite ease-in-out; }
.gift-tag .ico { width: 26px; height: 26px; }

/* ---------------- joystick + pointer ---------------- */
#joystick { position: absolute; width: 120px; height: 120px; margin: -60px 0 0 -60px; border-radius: 50%; background: rgba(255,255,255,.22); border: 3px solid rgba(255,255,255,.55); display: none; z-index: 4; pointer-events: none; }
#joystick.on { display: block; }
#joy-knob { position: absolute; left: 50%; top: 50%; width: 54px; height: 54px; margin: -27px 0 0 -27px; border-radius: 50%; background: radial-gradient(circle at 35% 30%, #ffffff, #dfe8f7); box-shadow: 0 4px 0 rgba(0,0,0,.2); }
#edge-arrow { position: absolute; width: 54px; height: 54px; margin: -27px 0 0 -27px; display: none; z-index: 4; pointer-events: none; }
#edge-arrow.on { display: block; }
#edge-arrow .ar { width: 100%; height: 100%; border-radius: 50%; background: #ff8a1f; border: 3px solid #fff; display: grid; place-items: center; box-shadow: 0 3px 0 rgba(0,0,0,.25); }
#edge-arrow .ar .ico { width: 28px; height: 28px; }

/* ---------------- toasts ---------------- */
#toasts { position: absolute; left: 50%; top: calc(100px + var(--safe-t)); transform: translateX(-50%); display: flex; flex-direction: column; gap: 8px; align-items: center; z-index: 30; pointer-events: none; }
.toast { display: flex; align-items: center; gap: 8px; padding: 9px 16px 9px 9px; border-radius: 16px; background: rgba(12,24,44,.88); color: #fff; font-family: var(--font-display); font-size: 17px; box-shadow: 0 4px 12px rgba(0,0,0,.25); animation: toastIn .35s cubic-bezier(.3,1.6,.5,1); max-width: min(92vw, 420px); }
.toast .ico { width: 30px; height: 30px; flex: 0 0 30px; }
.toast.out { animation: toastOut .3s forwards; }
@keyframes toastIn { from { transform: translateY(-20px) scale(.8); opacity: 0; } }
@keyframes toastOut { to { transform: translateY(-14px); opacity: 0; } }

/* ---------------- panels ---------------- */
#panel-layer { position: absolute; inset: 0; z-index: 20; display: none; align-items: center; justify-content: center; padding: calc(12px + var(--safe-t)) 14px calc(12px + var(--safe-b)); background: rgba(8,18,40,.5); }
#panel-layer.on { display: flex; }
.panel { position: relative; width: min(100%, 470px); max-height: 100%; display: flex; flex-direction: column; border-radius: 26px; background: var(--card-soft); box-shadow: 0 8px 0 rgba(0,0,0,.18), 0 20px 40px rgba(0,0,0,.35); animation: panelIn .3s cubic-bezier(.3,1.5,.5,1); overflow: hidden; }
.panel.wide { width: min(100%, 620px); }
@keyframes panelIn { from { transform: scale(.7); opacity: 0; } }
.panel-head { position: relative; padding: 14px 56px 14px 18px; background: linear-gradient(#3d7bff, #1d4fc4); color: #fff; font-family: var(--font-display); font-size: 26px; text-shadow: 0 2px 0 rgba(0,0,0,.25); display: flex; align-items: center; gap: 10px; }
.panel-head .ico { width: 36px; height: 36px; }
.panel-head small { display: block; font-family: var(--font-body); font-weight: 800; font-size: 13px; opacity: .9; text-shadow: none; }
.panel-close { position: absolute; right: 12px; top: 50%; transform: translateY(-50%); width: 40px; height: 40px; border-radius: 50%; background: linear-gradient(#ff6b6b, #e8383d); border: 3px solid #fff; display: grid; place-items: center; box-shadow: 0 3px 0 rgba(0,0,0,.25); }
.panel-close .ico { width: 18px; height: 18px; }
.panel-body { padding: 14px; overflow-y: auto; display: flex; flex-direction: column; gap: 10px; }
.tabs { display: flex; gap: 6px; padding: 10px 14px 0; flex-wrap: wrap; }
.tab { padding: 8px 14px; border-radius: 12px 12px 0 0; background: #d5deec; font-family: var(--font-display); font-size: 16px; color: var(--ink-soft); }
.tab.on { background: #fff; color: var(--brand-dark); }
.row { display: grid; grid-template-columns: 54px 1fr auto; gap: 10px; align-items: center; padding: 10px; border-radius: 16px; background: #fff; box-shadow: 0 2px 0 rgba(10,30,60,.1); }
.row .r-ico { width: 54px; height: 54px; border-radius: 14px; background: var(--card-soft); display: grid; place-items: center; }
.row .r-ico .ico { width: 44px; height: 44px; }
.row .r-main { min-width: 0; }
.row .r-title { font-family: var(--font-display); font-size: 18px; color: var(--ink); line-height: 1.1; }
.row .r-sub { font-weight: 800; font-size: 13px; color: var(--ink-soft); margin-top: 2px; }
.row .r-bar { height: 8px; border-radius: 5px; background: #e1e8f3; margin-top: 6px; overflow: hidden; }
.row .r-bar > div { height: 100%; background: linear-gradient(90deg, #4f8cff, #2563eb); }

<script>
// ---- js/util.js ----
// util.js — small shared helpers: math, easing, number formatting, a tiny event bus.
const U = {
  clamp: (v, a, b) => (v < a ? a : v > b ? b : v),
  lerp: (a, b, t) => a + (b - a) * t,
  damp: (a, b, k, dt) => a + (b - a) * (1 - Math.exp(-k * dt)),
  rand: (a, b) => a + Math.random() * (b - a),
  randi: (a, b) => Math.floor(a + Math.random() * (b - a + 1)),
  pick: (arr) => arr[Math.floor(Math.random() * arr.length)],
  chance: (p) => Math.random() < p,
  shuffle(arr) { for (let i = arr.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [arr[i], arr[j]] = [arr[j], arr[i]]; } return arr; },
  easeOutBack(t) { const c1 = 1.70158, c3 = c1 + 1; return 1 + c3 * Math.pow(t - 1, 3) + c1 * Math.pow(t - 1, 2); },
  easeOutCubic: (t) => 1 - Math.pow(1 - t, 3),
  easeInCubic: (t) => t * t * t,
  easeInOut: (t) => (t < 0.5 ? 2 * t * t : 1 - Math.pow(-2 * t + 2, 2) / 2),
  easeOutElastic(t) { if (t === 0 || t === 1) return t; return Math.pow(2, -10 * t) * Math.sin((t * 10 - 0.75) * (2 * Math.PI / 3)) + 1; },
  angleLerp(a, b, t) {
    let d = (b - a) % (Math.PI * 2);
    if (d > Math.PI) d -= Math.PI * 2; else if (d < -Math.PI) d += Math.PI * 2;
    return a + d * t;
  },
  dist2(ax, az, bx, bz) { const dx = ax - bx, dz = az - bz; return dx * dx + dz * dz; },
  dist(ax, az, bx, bz) { return Math.sqrt(U.dist2(ax, az, bx, bz)); },
  weighted(list, wf) {
    let tot = 0; for (const it of list) tot += Math.max(0, wf(it));
    let r = Math.random() * tot;
    for (const it of list) { r -= Math.max(0, wf(it)); if (r <= 0) return it; }
    return list[list.length - 1];
  },
  // 2.4K style numbers, matching the reference HUD.
  fmt(n) {
    if (!isFinite(n)) return '0';
    const neg = n < 0; n = Math.abs(n);
    let s;
    if (n < 1000) s = String(Math.floor(n));
    else {
      const units = ['K', 'M', 'B', 'T', 'aa', 'ab', 'ac', 'ad', 'ae', 'af'];
      let u = -1;
      while (n >= 1000 && u < units.length - 1) { n /= 1000; u++; }
      const d = n < 10 ? 2 : n < 100 ? 1 : 0, p = Math.pow(10, d);
      let t = (Math.floor(n * p + 1e-6) / p).toFixed(d);
      if (t.indexOf('.') >= 0) t = t.replace(/0+$/, '').replace(/\.$/, '');
      s = t + units[u];
    }
    return (neg ? '-' : '') + s;
  },
  fmtTime(sec) {
    sec = Math.max(0, Math.ceil(sec));
    const h = Math.floor(sec / 3600), m = Math.floor((sec % 3600) / 60), s = sec % 60;
    if (h > 0) return `${h}h ${m}m`;
    return `${m}:${String(s).padStart(2, '0')}`;
  },
  today() { const d = new Date(); return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`; },
  now: () => Date.now(),
  el(tag, cls, html) { const e = document.createElement(tag); if (cls) e.className = cls; if (html != null) e.innerHTML = html; return e; },
  $(sel) { return document.querySelector(sel); },
  vibrate(ms) { try { if (Store && Store.s && Store.s.settings.vib && navigator.vibrate) navigator.vibrate(ms); } catch (e) { /* not supported */ } },
  reducedMotion: (() => { try { return window.matchMedia('(prefers-reduced-motion: reduce)').matches; } catch (e) { return false; } })(),
};

// Minimal pub/sub so systems can react to each other without hard links.
const Bus = {
  _h: {},
  on(ev, fn) { (this._h[ev] || (this._h[ev] = [])).push(fn); return fn; },
  off(ev, fn) { const a = this._h[ev]; if (a) { const i = a.indexOf(fn); if (i >= 0) a.splice(i, 1); } },
  emit(ev, data) { const a = this._h[ev]; if (a) for (const fn of a.slice()) { try { fn(data); } catch (e) { console.error('[bus]', ev, e); } } },
};

  const O = '#172338';

  const st = (w = 3) => `stroke="${O}" stroke-width="${w}" stroke-linejoin="round" stroke-linecap="round"`;

    let d = '';
    for (let i = 0; i < n * 2; i++) {
      const r = i % 2 ? r2 : r1, a = rot + (i * Math.PI) / n;
      d += (i ? 'L' : 'M') + (cx + Math.cos(a) * r).toFixed(1) + ' ' + (cy + Math.sin(a) * r).toFixed(1);
    }
    return d + 'Z';
  }
  function gearPath(cx, cy, teeth, rOut, rIn, tw) {
    let d = '';
    for (let i = 0; i < teeth; i++) {
      const a = (i / teeth) * Math.PI * 2, a1 = a - tw, a2 = a + tw;
      const b1 = a + Math.PI / teeth - tw * 0.9, b2 = a - Math.PI / teeth + tw * 0.9;
      const p = (ang, r) => (cx + Math.cos(ang) * r).toFixed(1) + ' ' + (cy + Math.sin(ang) * r).toFixed(1);
      d += (i ? 'L' : 'M') + p(b2, rIn) + 'L' + p(a1, rOut) + 'L' + p(a2, rOut) + 'L' + p(b1, rIn);

  // Preload as <img> so canvas textures can draw them synchronously later.
  const imgs = {};
  function load() {
    const names = Object.keys(I);
    return Promise.all(names.map(n => new Promise(res => {
      const im = new Image();
      im.onload = () => { imgs[n] = im; res(); };
      im.onerror = () => res();
      im.src = 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(I[n]);
    })));
  }
  function html(name, cls = '') {
    return `<span class="ico ${cls}" aria-hidden="true">${I[name] || I.star}</span>`;
  }
  return { svg: I, imgs, load, html, starPath };

<script>
// ---- js/audio.js ----
// audio.js — every sound is synthesised with WebAudio, so the game ships with no audio files.
const Sfx = (() => {
  let ctx = null, master, sfxBus, musicBus, noiseBuf;
  const on = { sfx: true, music: true };
  const last = {};
  let musicTimer = null, nextNote = 0, step = 0, musicPlaying = false;

  function init() {
    if (ctx) return;
    const AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) return;
    ctx = new AC();
    master = ctx.createGain(); master.gain.value = 0.85; master.connect(ctx.destination);
    const comp = ctx.createDynamicsCompressor(); comp.threshold.value = -14; comp.ratio.value = 4; comp.connect(master);
    sfxBus = ctx.createGain(); sfxBus.gain.value = 0.6; sfxBus.connect(comp);
    musicBus = ctx.createGain(); musicBus.gain.value = 0.16; musicBus.connect(comp);
    noiseBuf = ctx.createBuffer(1, ctx.sampleRate * 1.0, ctx.sampleRate);
    const d = noiseBuf.getChannelData(0);
    for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
  }
  function unlock() {
    init();
    if (ctx && ctx.state === 'suspended') ctx.resume();
    if (on.music && !musicPlaying) startMusic();
  }
  function limit(name, ms) {
    const t = performance.now();
    if (last[name] && t - last[name] < ms) return false;
    last[name] = t; return true;
  }
  function tone(freq, dur, type = 'sine', vol = 0.3, o = {}) {
    if (!ctx || !on.sfx) return;
    const t0 = ctx.currentTime + (o.delay || 0);
    const osc = ctx.createOscillator(), g = ctx.createGain();
    osc.type = type;
    osc.frequency.setValueAtTime(freq, t0);
    if (o.to) osc.frequency.exponentialRampToValueAtTime(Math.max(20, o.to), t0 + (o.slide || dur));
    if (o.detune) osc.detune.value = o.detune;
    const a = o.attack || 0.005;
    g.gain.setValueAtTime(0.0001, t0);
    g.gain.exponentialRampToValueAtTime(vol, t0 + a);
    g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
    let node = osc;
    if (o.lp) { const f = ctx.createBiquadFilter(); f.type = 'lowpass'; f.frequency.value = o.lp; osc.connect(f); node = f; }
    node.connect(g); g.connect(o.bus || sfxBus);
    osc.start(t0); osc.stop(t0 + dur + 0.05);
  }
  function noise(dur, vol = 0.2, freq = 1200, type = 'bandpass', o = {}) {
    if (!ctx || !on.sfx) return;
    const t0 = ctx.currentTime + (o.delay || 0);
    const src = ctx.createBufferSource(); src.buffer = noiseBuf;
    const f = ctx.createBiquadFilter(); f.type = type; f.frequency.setValueAtTime(freq, t0); f.Q.value = o.q || 1;
    if (o.to) f.frequency.exponentialRampToValueAtTime(o.to, t0 + dur);
    const g = ctx.createGain();
    g.gain.setValueAtTime(0.0001, t0); g.gain.exponentialRampToValueAtTime(vol, t0 + (o.attack || 0.01)); g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
    src.connect(f); f.connect(g); g.connect(sfxBus);
    src.start(t0, Math.random() * 0.5); src.stop(t0 + dur + 0.05);
  }

  const play = {
    coin(n = 0) { if (!limit('coin', 35)) return; const f = 988 * Math.pow(2, Math.min(n, 20) / 12); tone(f, 0.08, 'square', 0.05, { lp: 4000 }); tone(f * 1.5, 0.14, 'triangle', 0.07, { delay: 0.035 }); },
    cash() { if (!limit('cash', 80)) return; noise(0.08, 0.15, 3000, 'highpass'); tone(1568, 0.12, 'square', 0.05, { delay: 0.05, lp: 5000 }); tone(2093, 0.25, 'triangle', 0.09, { delay: 0.1 }); },
    pop() { if (!limit('pop', 40)) return; tone(U.rand(500, 800), 0.07, 'sine', 0.16, { to: 180, slide: 0.06 }); },
    bubble() { if (!limit('bubble', 60)) return; tone(U.rand(300, 500), 0.12, 'sine', 0.1, { to: U.rand(900, 1300), slide: 0.1 }); },
    squeak() { tone(1800, 0.18, 'sine', 0.08, { to: 2700, slide: 0.08 }); tone(2600, 0.12, 'sine', 0.06, { delay: 0.1, to: 1700 }); },
    honk(p = 1) { if (!limit('honk', 250)) return; tone(330 * p, 0.28, 'sawtooth', 0.07, { lp: 1200, detune: 8 }); tone(415 * p, 0.28, 'sawtooth', 0.06, { lp: 1200 }); },
    quack() { tone(560, 0.12, 'sawtooth', 0.07, { to: 380, lp: 1500 }); tone(520, 0.12, 'sawtooth', 0.06, { delay: 0.14, to: 340, lp: 1500 }); },
    siren() { if (!limit('siren', 1200)) return; for (let i = 0; i < 4; i++) tone(i % 2 ? 900 : 700, 0.22, 'triangle', 0.05, { delay: i * 0.22 }); },
    jingle() { if (!limit('jingle', 2500)) return; [784, 988, 1175, 988, 784, 659].forEach((f, i) => tone(f, 0.16, 'triangle', 0.05, { delay: i * 0.14 })); },
    click() { tone(1200, 0.04, 'square', 0.04, { lp: 3000 }); },
    tap() { tone(700, 0.05, 'sine', 0.08, { to: 1000 }); },
    error() { tone(160, 0.16, 'square', 0.06, { lp: 800 }); tone(120, 0.2, 'square', 0.06, { delay: 0.08, lp: 800 }); },
    whoosh() { noise(0.35, 0.12, 400, 'bandpass', { to: 2400, q: 0.8 }); },
    spray() { if (!limit('spray', 220)) return; noise(0.3, 0.06, 2500, 'bandpass', { q: 0.6 }); },
    splash() { if (!limit('splash', 150)) return; noise(0.25, 0.1, 900, 'lowpass', { to: 300 }); },
    fan() { if (!limit('fan', 400)) return; noise(0.45, 0.05, 600, 'bandpass', { to: 900, q: 0.5 }); },
    scrub() { if (!limit('scrub', 260)) return; noise(0.22, 0.06, 1500, 'bandpass', { q: 2 }); },
    build() { [523, 659, 784, 1047].forEach((f, i) => tone(f, 0.18, 'triangle', 0.09, { delay: i * 0.07 })); noise(0.2, 0.08, 300, 'lowpass', { delay: 0.28 }); },
    upgrade() { [659, 880, 1319].forEach((f, i) => tone(f, 0.14, 'square', 0.045, { delay: i * 0.06, lp: 3500 })); tone(1760, 0.3, 'triangle', 0.06, { delay: 0.18 }); },
    levelup() { [523, 659, 784, 1047, 1319, 1568].forEach((f, i) => tone(f, 0.25, 'triangle', 0.09, { delay: i * 0.08 })); tone(2093, 0.6, 'sine', 0.08, { delay: 0.5 }); },
    reward() { [784, 1047, 1319, 1568].forEach((f, i) => tone(f, 0.2, 'triangle', 0.08, { delay: i * 0.06 })); },
    rage() { tone(220, 0.3, 'sawtooth', 0.07, { to: 90, lp: 900 }); noise(0.4, 0.1, 500, 'lowpass', { delay: 0.05 }); },
    poof() { noise(0.35, 0.14, 700, 'lowpass', { to: 200 }); },
    snore() { tone(110, 0.6, 'sawtooth', 0.025, { lp: 400, to: 140, slide: 0.5 }); },
    wake() { tone(600, 0.1, 'square', 0.04, { to: 1200, lp: 2500 }); },
    tick() { if (!limit('tick', 30)) return; tone(1500, 0.025, 'square', 0.03, { lp: 4000 }); },
    pew() { if (!limit('pew', 45)) return; tone(900, 0.08, 'sine', 0.05, { to: 400 }); },
    splat() { if (!limit('splat', 50)) return; noise(0.12, 0.12, 500, 'lowpass', { to: 150 }); },
    boom() { noise(0.6, 0.25, 300, 'lowpass', { to: 60 }); tone(80, 0.5, 'sine', 0.15, { to: 40 }); },
    win() { [523, 659, 784, 659, 784, 1047].forEach((f, i) => tone(f, 0.22, 'square', 0.05, { delay: i * 0.12, lp: 3000 })); },
    lose() { [392, 349, 330, 262].forEach((f, i) => tone(f, 0.3, 'triangle', 0.08, { delay: i * 0.18 })); },
    hire() { [440, 554, 659].forEach((f, i) => tone(f, 0.16, 'triangle', 0.08, { delay: i * 0.08 })); tone(880, 0.3, 'sine', 0.06, { delay: 0.25 }); },
    gem() { [1319, 1760, 2349].forEach((f, i) => tone(f, 0.18, 'sine', 0.07, { delay: i * 0.05 })); },
  };

  // ---------- music: bouncy loop in C major, 112 bpm ----------
  const BPM = 112, S16 = 60 / BPM / 4;
  const chords = [[48, 55, 64, 67], [45, 52, 60, 64], [41, 48, 57, 60], [43, 50, 59, 62]];
  const mel = [72, -1, 76, 79, 76, -1, 74, 72, 69, -1, 72, 74, 72, -1, 67, -1, 65, -1, 69, 72, 69, -1, 67, 65, 67, -1, 71, 74, 72, -1, -1, -1];
  const mtof = (m) => 440 * Math.pow(2, (m - 69) / 12);
  function note(m, t, dur, type, vol) {
    const osc = ctx.createOscillator(), g = ctx.createGain();
    osc.type = type; osc.frequency.setValueAtTime(mtof(m), t);
    g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(vol, t + 0.01); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    osc.connect(g); g.connect(musicBus); osc.start(t); osc.stop(t + dur + 0.05);
  }
  function scheduler() {
    if (!ctx) return;
    while (nextNote < ctx.currentTime + 0.2) {
      const bar = Math.floor(step / 16) % 4, s = step % 16, ch = chords[bar];
      if (s % 4 === 0) note(ch[0] - 12, nextNote, S16 * 3, 'triangle', 0.5);
      if (s % 4 === 2) note(ch[0], nextNote, S16 * 1.5, 'triangle', 0.25);
      if (s % 4 === 2) { note(ch[2], nextNote, S16 * 1.2, 'square', 0.05); note(ch[3], nextNote, S16 * 1.2, 'square', 0.04); }
      const mm = mel[(step % 32)];
      if (mm > 0 && (Math.floor(step / 32) % 2 === 0 || s % 2 === 0)) note(mm, nextNote, S16 * 1.8, 'sine', 0.16);
      if (s % 8 === 4) { // soft clap
        const src = ctx.createBufferSource(); src.buffer = noiseBuf;
        const f = ctx.createBiquadFilter(); f.type = 'highpass'; f.frequency.value = 2500;
        const g = ctx.createGain(); g.gain.setValueAtTime(0.12, nextNote); g.gain.exponentialRampToValueAtTime(0.0001, nextNote + 0.08);
        src.connect(f); f.connect(g); g.connect(musicBus); src.start(nextNote, Math.random() * 0.5); src.stop(nextNote + 0.1);
      }
      nextNote += S16; step++;
    }
  }
  function startMusic() {
    if (!ctx || musicPlaying) return;
    musicPlaying = true; nextNote = ctx.currentTime + 0.1; step = 0;
    musicTimer = setInterval(scheduler, 50);
  }
  function stopMusic() { musicPlaying = false; if (musicTimer) clearInterval(musicTimer); musicTimer = null; }
  function setSfx(v) { on.sfx = v; }
  function setMusic(v) { on.music = v; if (v) { if (ctx) startMusic(); } else stopMusic(); }
  function duck(v) { if (master) master.gain.setTargetAtTime(v ? 0.0001 : 0.85, ctx.currentTime, 0.05); }

  return { unlock, play, setSfx, setMusic, duck, get ready() { return !!ctx; } };
})();

</script>
<script>
// ---- js/save.js ----
// save.js — the whole save is one JSON object in localStorage (wrapped: storage can be blocked).
const Store = (() => {
  let s = null;
  // ?slot=name keeps a separate save (handy for testing without touching the main one)
  const KEY = (() => { try { const q = new URLSearchParams(location.search).get('slot'); return CFG.saveKey + (q ? '.' + q.replace(/[^a-z0-9_-]/gi, '') : ''); } catch (e) { return CFG.saveKey; } })();
  function defaults() {
    const now = Date.now();
    return {
      v: 1, created: now, lastSeen: now, sessions: 0,
      cash: 0, gems: 15, xp: 0, level: 1,
      loc: 0, unlockedLocs: 1,
      locs: {},
      gemUp: { sponge: 0, offline: 0, tickets: 0 },
      hats: { owned: ['cap'], on: 'cap' },
      perks: { noads: false, starter: false, vip: false },
      daily: { day: 0, last: '' },
      spin: { lastFree: 0, adDay: '', adCount: 0, tokens: 1 },
      blaster: { level: 1, tickets: 3, lastTick: now },
      album: {},
      boosts: { income: 0, speed: 0, turbo: 0 },
      adCaps: { day: '', freeCash: 0, freeGems: 0, ticket: 0, blasterX3: 0, spin: 0 },
      cool: { freeUpgrade: 0, turbo: 0 },
      stats: { cars: 0, earned: 0, tips: 0, rage: 0, vip: 0, playSecs: 0, blasterWins: 0, upgrades: 0, collects: 0 },
      settings: { sfx: true, music: true, vib: true, quality: 'high' },
      tut: { done: false },
    };
  }
  function locDefaults() {
    return {
      pads: {}, paid: {},
      st: { brush: 1, rinse: 1, wax: 1, dryer: 1, tire: 1, polish: 1, pay: 1 },
      racks: { soap: 1, wax: 1, gel: 1 },
      tr: {},
      quest: 0, qBase: null,
      cars: 0, earned: 0, tips: 0, vip: 0,
      hoppers: {}, rackStock: {}, piles: {}, trays: {},
    };
  }
  function deepMerge(base, add) {
    if (!add || typeof add !== 'object') return base;
    for (const k of Object.keys(add)) {
      if (add[k] && typeof add[k] === 'object' && !Array.isArray(add[k]) && base[k] && typeof base[k] === 'object' && !Array.isArray(base[k])) deepMerge(base[k], add[k]);
      else base[k] = add[k];
    }
    return base;
  }
  function load(snapshot) {
    let raw = null;
    if (snapshot) raw = snapshot;
    else { try { raw = localStorage.getItem(KEY); } catch (e) { raw = null; } }
    let data = null;
    try { data = raw ? JSON.parse(raw) : null; } catch (e) { data = null; }
    s = deepMerge(defaults(), data || {});
    for (const id of Object.keys(s.locs)) s.locs[id] = deepMerge(locDefaults(), s.locs[id]);
    return { state: s, fresh: !data };
  }
  function loc(id) {
    if (!s.locs[id]) s.locs[id] = locDefaults();
    return s.locs[id];
  }
  function serialize() { s.lastSeen = Date.now(); return JSON.stringify(s); }
  function save() {
    if (!s) return;
    try { localStorage.setItem(KEY, serialize()); } catch (e) { /* storage unavailable: keep playing */ }
  }
  function wipe() {
    try { localStorage.removeItem(KEY); } catch (e) { /* ignore */ }
    s = defaults();
  }
  // Daily ad caps reset at local midnight.
  function caps() {
    const t = U.today();
    if (s.adCaps.day !== t) s.adCaps = { day: t, freeCash: 0, freeGems: 0, ticket: 0, blasterX3: 0, spin: 0 };
    return s.adCaps;
  }
  return { load, save, wipe, loc, serialize, caps, get s() { return s; }, locDefaults };
})();

</script>

const Ads = (() => {
  let provider = null, providerName = 'mock';
  let busy = false, lastInter = 0, lastRewarded = 0;
  const sessionStart = Date.now();
  const log = (...a) => console.info('[ads]', ...a);

  // ---------------- mock provider ----------------
  const creatives = [
    { game: 'Bubble Pop Saga', line: 'Pop 10,000 bubbles. Relax. Repeat.', bg: 'linear-gradient(160deg,#ff8ad1,#7b4dff 60%,#3a2bd8)', icon: 'bubble' },
    { game: 'Mega Mower Tycoon', line: 'Mow lawns. Get rich. Buy a gold mower.', bg: 'linear-gradient(160deg,#9cf06e,#2fae24 60%,#127a2a)', icon: 'trophy' },
    { game: 'Burger Bounce', line: 'Stack the tallest burger in town!', bg: 'linear-gradient(160deg,#ffd36e,#ff8a1f 60%,#e8383d)', icon: 'star' },
    { game: 'Penguin Plumber', line: 'Fix pipes. Save the igloo.', bg: 'linear-gradient(160deg,#9fe6ff,#2f8cff 60%,#1a46b8)', icon: 'water' },

  function showMock(kind, secs) {

      const bubbles = Array.from({ length: 12 }, (_, i) => `<i style="left:${(i * 8.5 + Math.random() * 6).toFixed(1)}%;animation-delay:${(Math.random() * 3).toFixed(2)}s;transform:scale(${(0.5 + Math.random()).toFixed(2)})"></i>`).join('');
      layer.innerHTML = `
        <div class="ad-top"><span><span class="adtag">AD</span> &nbsp;${kind === 'rewarded' ? 'Reward in <b id="ad-count">' + secs + '</b>s' : 'Skip in <b id="ad-count">' + secs + '</b>s'}</span>

        hat = hatMesh(id, o.cap || PAL.blue, !!o.star); hatHolder.add(hat); api.hatId = id;
      },
      animate(dt, speed01, carrying, extra) {
        api.phase += dt * (5 + speed01 * 9);
        const sw = Math.sin(api.phase) * 0.75 * speed01;
        legL.rotation.x = sw; legR.rotation.x = -sw;
        if (extra === 'polish') {
          const t = api.phase * 0.8;
          armL.rotation.set(-1.35 + Math.sin(t) * 0.25, 0, Math.cos(t) * 0.3);
          armR.rotation.set(-1.35 + Math.cos(t) * 0.25, 0, -Math.sin(t) * 0.3);
        } else if (extra === 'sleep') {
          armL.rotation.set(0.1, 0, 0.12); armR.rotation.set(0.1, 0, -0.12);
          body.rotation.x = U.damp(body.rotation.x, 0.22, 4, dt);
        } else if (extra === 'cheer') {
          armL.rotation.set(-2.8 + Math.sin(api.phase * 2) * 0.3, 0, 0.2); armR.rotation.set(-2.8 - Math.sin(api.phase * 2) * 0.3, 0, -0.2);
        } else if (carrying) {
          armL.rotation.set(-1.2, 0, 0.1); armR.rotation.set(-1.2, 0, -0.1);
        } else {
          armL.rotation.set(-sw * 0.8, 0, 0.06); armR.rotation.set(sw * 0.8, 0, -0.06);
        }
        if (extra !== 'sleep') body.rotation.x = U.damp(body.rotation.x, speed01 * 0.08, 6, dt);
        body.position.y = Math.abs(Math.sin(api.phase)) * 0.07 * speed01 + (speed01 < 0.05 ? Math.sin(api.phase * 0.4) * 0.012 : 0);
      },
    };
    return api;
  }

  // sedan-like body; P = paint builder (white = paint colour), T = trim builder
  function sedanBody(P, T, o) {
    const top = o.by + o.bh;
    P.rbox(o.len, o.bh, o.w, 0.28, W, { y: o.by + o.bh / 2 });
    T.rbox(o.cl, o.ch, o.w - 0.16, 0.24, PAL.glass, { x: o.cx, y: top + o.ch / 2 - 0.06 });
    P.rbox(o.cl - 0.12, 0.14, o.w - 0.1, 0.07, W, { x: o.cx, y: top + o.ch - 0.03 });
    for (const sz of [-1, 1]) {
      P.box(0.13, o.ch - 0.04, 0.09, W, { x: o.cx + o.cl / 2 - 0.16, y: top + o.ch / 2 - 0.04, z: sz * (o.w / 2 - 0.1), rz: 0.35 });
      P.box(0.13, o.ch - 0.04, 0.09, W, { x: o.cx - o.cl / 2 + 0.16, y: top + o.ch / 2 - 0.04, z: sz * (o.w / 2 - 0.1), rz: -0.3 });
      P.box(0.11, o.ch - 0.06, 0.07, W, { x: o.cx + (o.bp || 0), y: top + o.ch / 2 - 0.04, z: sz * (o.w / 2 - 0.09) });
      T.rbox(0.08, 0.17, 0.38, 0.04, 0xfff3b0, { x: o.len / 2 - 0.03, y: o.by + o.bh * 0.62, z: sz * (o.w / 2 - 0.33) });
      T.rbox(0.08, 0.16, 0.34, 0.04, 0xff3b3b, { x: -o.len / 2 + 0.03, y: o.by + o.bh * 0.62, z: sz * (o.w / 2 - 0.3) });
      P.rbox(0.14, 0.12, 0.18, 0.04, W, { x: o.cx + o.cl / 2 - 0.05, y: top + 0.08, z: sz * (o.w / 2 + 0.07) });
    }
    T.rbox(0.2, 0.22, o.w - 0.08, 0.08, 0x8d96a5, { x: o.len / 2 - 0.03, y: o.by + 0.12 });
    T.rbox(0.2, 0.22, o.w - 0.08, 0.08, 0x8d96a5, { x: -o.len / 2 + 0.03, y: o.by + 0.12 });
    T.box(0.05, 0.16, o.w * 0.42, 0x2a2e36, { x: o.len / 2 + 0.01, y: o.by + o.bh * 0.42 });
    T.box(0.03, 0.15, 0.42, 0xffffff, { x: -o.len / 2 - 0.02, y: o.by + o.bh * 0.38 });
    return [
      { kind: 'top', x0: o.cx + o.cl / 2 + 0.05, x1: o.len / 2 - 0.25, y: top, z0: -o.w / 2 + 0.3, z1: o.w / 2 - 0.3 },

      { kind: 'top', x0: o.cx - o.cl / 2 + 0.3, x1: o.cx + o.cl / 2 - 0.3, y: top + o.ch + 0.04, z0: -o.w / 2 + 0.35, z1: o.w / 2 - 0.35 },
      { kind: 'side', x0: -o.len / 2 + 0.35, x1: o.len / 2 - 0.35, y0: o.by + 0.18, y1: top - 0.12, z: o.w / 2 + 0.01 },
    ];
  }

  // spinning blue roller brush
  let rollerGeo = null;
  function roller() {
    if (!rollerGeo) {
      const pts = [];
      const hgt = 2.85, n = 16;
      pts.push([0.001, 0]);
      for (let i = 0; i <= n; i++) { const y = (i / n) * hgt; pts.push([i % 2 ? 0.55 : 0.67, y]); }
      pts.push([0.001, hgt]);
      const b = new Builder();
      b.lathe(pts, 14, PAL.brush, { flat: false });
      b.cyl(0.24, 0.24, 0.12, 10, 0x6f7b8e, { y: hgt + 0.02 });
      rollerGeo = b.merge();
    }
    const m = new THREE.Mesh(rollerGeo, MAT.vc); m.castShadow = true; return m;
  }

  function pipe(b, pts, r = 0.11, col = PAL.blue) {
    for (let i = 0; i < pts.length - 1; i++) {
      const [x0, y0, z0] = pts[i], [x1, y1, z1] = pts[i + 1];
      const len = Math.hypot(x1 - x0, y1 - y0, z1 - z0);
      const mid = new THREE.Vector3((x0 + x1) / 2, (y0 + y1) / 2, (z0 + z1) / 2);
      const dir = new THREE.Vector3(x1 - x0, y1 - y0, z1 - z0).normalize();
      const q = new THREE.Quaternion().setFromUnitVectors(new THREE.Vector3(0, 1, 0), dir);
      const m = new THREE.Matrix4().compose(mid, q, new THREE.Vector3(1, 1, 1));
      b.cyl(r, r, len, 8, col, { m });
      b.sphere(r * 1.25, col, { x: x1, y: y1, z: z1, ws: 8, hs: 6 });
    }
    b.sphere(r * 1.25, col, { x: pts[0][0], y: pts[0][1], z: pts[0][2], ws: 8, hs: 6 });
  }

  function hopper(supply) {
    const g = new THREE.Group();
    const col = CFG.supplies[supply].color;
    const b = new Builder();
    b.rbox(1.3, 0.18, 1.1, 0.05, 0x9aa3b1, { y: 0.09 });
    b.cyl(0.46, 0.5, 1.1, 16, 0xf4f6fa, { y: 0.73 });
    b.cyl(0.505, 0.505, 0.22, 16, col, { y: 0.55 });
    b.cyl(0.62, 0.46, 0.34, 16, col, { y: 1.45 });
    b.torus(0.6, 0.05, 0xffffff, { y: 1.62, rx: Math.PI / 2, ts: 20 });
    const m = b.build(); g.add(m);
    // fill level column (scaled)
    const fill = new THREE.Mesh(GEO.cyl(0.48, 0.48, 1, 16), new THREE.MeshLambertMaterial({ color: col, transparent: true, opacity: 0.0 }));
    fill.visible = false;
    // icon disc facing the camera
    const icon = new THREE.Mesh(GEO.circle(0.36, 20), new THREE.MeshBasicMaterial({ map: iconTex(CFG.supplies[supply].icon, '#ffffff'), transparent: true }));
    icon.position.set(0, 0.78, 0); icon.rotation.y = camYawRot();
    icon.position.add(new THREE.Vector3(Math.sin(camYawRot()), 0, Math.cos(camYawRot())).multiplyScalar(0.52));
    g.add(icon);
    // stock pips: 8 small lights around the funnel
    const pips = [];
    for (let i = 0; i < CFG.hopperCap; i++) {
      const p = new THREE.Mesh(GEO.box(0.12, 0.1, 0.06), new THREE.MeshBasicMaterial({ color: 0x3a3f47 }));
      const a = camYawRot();
      const off = (i - (CFG.hopperCap - 1) / 2) * 0.14;
      p.position.set(Math.sin(a) * 0.5 + Math.cos(a) * off, 1.18, Math.cos(a) * 0.5 - Math.sin(a) * off);
      p.rotation.y = a;
      g.add(p); pips.push(p);
    }
    return { group: g, pips, fill, color: col };
  }
  function iconTex(name, bg = '#ffffff', ring = null) {
    return TEX.make(128, 128, (ctx) => {
      ctx.beginPath(); ctx.arc(64, 64, 60, 0, Math.PI * 2); ctx.fillStyle = bg; ctx.fill();
      if (ring) { ctx.lineWidth = 8; ctx.strokeStyle = ring; ctx.stroke(); }
      TEX.icon(ctx, name, 64, 64, 92);
    }, 'icon|' + name + '|' + bg + '|' + ring);
  }

  // ---------- machines (centred at origin; car runs along +x; south side = +z faces camera) ----------
  function legs4(b, dx, dz, h, col = PAL.white) {
    for (const sx of [-1, 1]) for (const sz of [-1, 1]) {
      b.rbox(0.48, h, 0.48, 0.1, col, { x: sx * dx, y: h / 2, z: sz * dz });
      b.rbox(0.66, 0.22, 0.66, 0.06, 0x9aa3b1, { x: sx * dx, y: 0.11, z: sz * dz });
    }
  }
  function machine(type) {
    const g = new THREE.Group();
    const b = new Builder();
    const anim = { t: 0 };
    const accent = PAL.blue;
    if (type === 'brush') {
      // gantry beam on the west side; rollers hang east of it so they stay visible from above
      for (const sz of [-1, 1]) {
        b.rbox(0.55, 3.75, 0.55, 0.12, PAL.white, { x: -0.95, y: 1.87, z: sz * 2.2 });
        b.rbox(0.58, 0.2, 0.58, 0.08, accent, { x: -0.95, y: 2.6, z: sz * 2.2 });
        b.rbox(0.8, 0.24, 0.8, 0.08, 0x9aa3b1, { x: -0.95, y: 0.12, z: sz * 2.2 });
        b.rbox(1.9, 0.22, 0.34, 0.08, 0x9aa3b1, { x: 0.0, y: 3.42, z: sz * 1.62 });
        b.cyl(0.09, 0.09, 0.32, 8, 0x6f7b8e, { x: 0.32, y: 3.18, z: sz * 1.62 });
      }
      b.rbox(1.35, 0.95, 5.0, 0.3, PAL.white, { x: -0.95, y: 3.95 });
      b.rbox(1.38, 0.16, 5.03, 0.06, accent, { x: -0.95, y: 3.68 });
      b.rbox(1.38, 0.16, 5.03, 0.06, accent, { x: -0.95, y: 4.2 });
      b.rbox(0.9, 0.42, 0.08, 0.06, PAL.blueLight, { x: -0.95, y: 3.95, z: 2.52 });
      pipe(b, [[0, 1.25, 2.75], [0, 1.8, 2.75], [-0.95, 1.8, 2.75], [-0.95, 3.5, 2.75], [-0.95, 3.5, 2.5]]);
      const rl = roller(), rr = roller();
      rl.position.set(0.32, 0.25, -1.62); rr.position.set(0.32, 0.25, 1.62);
      g.add(rl, rr);
      anim.update = (dt, active) => {
        anim.spin = U.damp(anim.spin || 0, active ? 9 : 0.3, 3, dt);
        rl.rotation.y += anim.spin * dt; rr.rotation.y -= anim.spin * dt;
      };
    } else if (type === 'rinse') {
      for (const sz of [-1, 1]) {
        b.rbox(0.62, 3.4, 0.7, 0.12, 0xe3e7ee, { y: 1.7, z: sz * 2.15 });
        b.rbox(0.8, 0.22, 0.88, 0.06, 0x9aa3b1, { y: 0.11, z: sz * 2.15 });
        b.rbox(0.66, 0.2, 0.74, 0.06, accent, { y: 2.6, z: sz * 2.15 });
      }
      b.rbox(1.25, 0.7, 5.0, 0.2, 0xe3e7ee, { y: 3.55 });
      b.rbox(1.0, 0.18, 4.4, 0.06, 0x3a3f47, { y: 3.14 });
      for (let i = 0; i < 9; i++) b.cyl(0.05, 0.07, 0.14, 6, 0x9aa3b1, { y: 3.0, z: -1.75 + i * 0.44 });
      pipe(b, [[-0.45, 3.95, -2.4], [-0.45, 4.25, -2.4], [-0.45, 4.25, 2.4], [-0.45, 3.95, 2.4]]);
      pipe(b, [[0.45, 4.15, 2.45], [0.45, 4.15, 2.8], [0.45, 0.4, 2.8]], 0.1);
      // water curtain

    // machine
    b.rbox(1.5, 1.55, 1.3, 0.2, 0xf4f6fa, { x: -1.95, y: 0.78 });

    b.cyl(0.12, 0.12, 0.5, 8, 0x9aa3b1, { x: -1.2, y: 1.05, rz: Math.PI / 2 });
    // output table
    b.rbox(2.5, 0.12, 1.25, 0.05, 0xdfe7f5, { x: 0.35, y: 0.72 });
    b.rbox(2.56, 0.12, 1.31, 0.05, PAL.blue, { x: 0.35, y: 0.62 });

    const m = b.build(); g.add(m);
    // giant product replica on top of the machine
    const giant = new THREE.Mesh(itemGeometry(supply), MAT.vc);
    giant.scale.setScalar(2.7); giant.position.set(-1.95, 1.55, 0); giant.rotation.y = 0.5; giant.castShadow = true;
    g.add(giant);
    const sign = new THREE.Mesh(GEO.plane(2.2, 0.48), new THREE.MeshLambertMaterial({ map: TEX.sign(CFG.supplies[supply].name.toUpperCase(), '#ffffff', '#1a46b8', 512, 112, CFG.supplies[supply].icon), transparent: true }));
    sign.position.set(-1.95, 1.0, 0.68);
    g.add(sign);
    const slots = [];
    for (let layer = 0; layer < 3; layer++) for (const z of [-0.27, 0.27]) for (let i = 0; i < 3; i++) slots.push(new THREE.Vector3(-0.4 + i * 0.75, 0.78 + layer * 0.45, z));
    return { group: g, slots, giant };
  }

  function signBoard(label, w, h, bg, fg, icon, texW = 512) {
    const texH = Math.round(texW * h / w);

      ctx.beginPath(); ctx.arc(19, 44, 4.5, 0, Math.PI * 2); ctx.fill(); ctx.beginPath(); ctx.arc(46, 44, 4.5, 0, Math.PI * 2); ctx.fill();

      TEX.text(ctx, 'CAR', 640, 128, 120, '#ffffff', 'rgba(0,0,0,.18)', 10);

// ---- js/fx.js ----
// fx.js — instanced particles, mud splats and foam that stick to cars, flying objects,
// floating text and world-anchored DOM labels.
class Particles {
  constructor(geo, mat, cap, o = {}) {
    this.mesh = new THREE.InstancedMesh(geo, mat, cap);

    this.colors = !!o.colors;
  }
  spawn(o) {
    if (this.p.length >= this.cap) this.p.shift();
    const q = {
      x: o.x, y: o.y, z: o.z, vx: o.vx || 0, vy: o.vy || 0, vz: o.vz || 0,
      life: 0, max: o.life || 1, s0: o.s0 != null ? o.s0 : 1, s1: o.s1 != null ? o.s1 : 0, sm: o.sm || 0,
      g: o.g || 0, drag: o.drag || 0, rx: o.rx || 0, ry: o.ry || 0, rz: o.rz || 0, vr: o.vr || 0,
      col: o.col != null ? new THREE.Color(o.col) : null, sx: o.sx || 1, sy: o.sy || 1, sz: o.sz || 1, floor: o.floor,
    };

    return q;
  }
  update(dt, camQ) {
    const m = new THREE.Matrix4(), pos = new THREE.Vector3(), qu = new THREE.Quaternion(), sc = new THREE.Vector3(), e = new THREE.Euler();
    let n = 0;
    for (let i = 0; i < this.p.length; i++) {
      const q = this.p[i];
      q.life += dt;
      if (q.life >= q.max) { this.p.splice(i, 1); i--; continue; }
      q.vy -= q.g * dt;
      if (q.drag) { const d = Math.exp(-q.drag * dt); q.vx *= d; q.vy *= d; q.vz *= d; }
      q.x += q.vx * dt; q.y += q.vy * dt; q.z += q.vz * dt;
      if (q.floor != null && q.y < q.floor) { q.y = q.floor; q.vy *= -0.3; q.vx *= 0.6; q.vz *= 0.6; }

    for (let i = 0; i < this.items.length; i++) {
      const it = this.items[i];
      it.k = U.damp(it.k, it.target, it.target > it.k ? 10 : 7, dt);
      if ((it.dead || it.target === 0) && it.k < 0.03) { this.items.splice(i, 1); i--; continue; }
      it.wob += dt * 3;
      const wob = 1 + Math.sin(it.wob) * 0.04;
      s.copy(it.scale).multiplyScalar(it.k * wob);
      m.compose(it.pos, it.quat, s);
      m.premultiply(it.parent.matrixWorld);
      this.mesh.setMatrixAt(n, m);
      if (this.colors && it.col) this.mesh.instanceColor.setXYZ(n, it.col.r, it.col.g, it.col.b);
      n++;
    }
    this.mesh.count = n;
    this.mesh.instanceMatrix.needsUpdate = true;
    if (this.colors) this.mesh.instanceColor.needsUpdate = true;
  }
  removeAll(parent) { for (const it of this.items) if (it.parent === parent) { it.target = 0; it.dead = true; } }
}

const FX = (() => {
  let sys = {}, labelsEl, root;
  const texts = [], labels = [], flyers = [];
  const tmp = { x: 0, y: 0, vis: false };

  function init(scene) {
    root = new THREE.Group(); scene.add(root);
    labelsEl = document.getElementById('labels');
    const lam = (c, o) => new THREE.MeshLambertMaterial(Object.assign({ color: c }, o || {}));
    sys.foam = new Particles(GEO.ico(0.3, 1), lam(0xffffff), 500, { shadow: false });
    sys.colorFoam = new Particles(GEO.ico(0.3, 1), lam(0xffffff), 300, { colors: true });
    sys.bubble = new Particles(GEO.sphere(0.2, 10, 8), new THREE.MeshLambertMaterial({ color: 0xcdeeff, transparent: true, opacity: 0.55, depthWrite: false }), 200);
    sys.water = new Particles(GEO.sphere(0.07, 6, 4), new THREE.MeshBasicMaterial({ color: 0x7fd0ff }), 600);
    sys.sparkle = new Particles(GEO.plane(0.6, 0.6), new THREE.MeshBasicMaterial({ map: TEX.sparkle(), transparent: true, depthWrite: false, blending: THREE.AdditiveBlending, color: 0xfff3a0 }), 300, { billboard: true });
    sys.confetti = new Particles(GEO.box(0.16, 0.03, 0.1), new THREE.MeshBasicMaterial({ color: 0xffffff }), 500, { colors: true });
    sys.smoke = new Particles(GEO.ico(0.5, 1), lam(0xd9dde4), 160);
    sys.wind = new Particles(GEO.box(0.04, 0.9, 0.04), new THREE.MeshBasicMaterial({ color: 0xfff6d0, transparent: true, opacity: 0.7 }), 260);
    sys.coin = new Particles(Models.coinGeometry(), MAT.vc, 200, { shadow: true });
    sys.cash = new Particles(Models.cashBundleGeo(), MAT.vc, 120, { shadow: true });
    sys.glow = new Particles(GEO.plane(1, 1), new THREE.MeshBasicMaterial({ map: TEX.glow(), transparent: true, depthWrite: false, blending: THREE.AdditiveBlending, color: 0xffe9a0 }), 60, { billboard: true });
    for (const k in sys) root.add(sys[k].mesh);
    // mud splats + foam coats
    sys.mud = new Stickers(GEO.ico(1, 1), new THREE.MeshLambertMaterial({ color: 0xffffff, flatShading: false }), 1400, true);
    sys.coat = new Stickers(GEO.ico(1, 1), lam(0xffffff), 900, true);
    root.add(sys.mud.mesh, sys.coat.mesh);
  }

  function update(dt) {
    const cq = GFX.camera.quaternion;
    for (const k in sys) sys[k].update(dt, cq);
    // flyers
    for (let i = 0; i < flyers.length; i++) {
      const f = flyers[i];
      f.t += dt / f.dur;
      const to = typeof f.to === 'function' ? f.to() : f.to;
      const t = Math.min(1, f.t), e = f.ease ? f.ease(t) : t;
      const p = f.obj.position;
      p.lerpVectors(f.from, to, e);
      p.y += Math.sin(Math.PI * t) * f.arc;
      if (f.spin) { f.obj.rotation.y += dt * f.spin; f.obj.rotation.x += dt * f.spin * 0.5; }
      if (f.scaleTo != null) f.obj.scale.setScalar(U.lerp(f.scaleFrom, f.scaleTo, t));
      if (f.t >= 1) { flyers.splice(i, 1); i--; if (f.done) f.done(f.obj); }
    }
    updateDom(dt);
  }

  // ---------- particle helpers ----------
  function foamBurst(x, y, z, n = 10, spread = 1.2, colors) {
    for (let i = 0; i < n; i++) {
      const s = colors ? sys.colorFoam : sys.foam;
      s.spawn({ x: x + U.rand(-spread, spread), y: y + U.rand(-0.3, 0.8), z: z + U.rand(-spread, spread), vx: U.rand(-0.6, 0.6), vy: U.rand(0.2, 1.4), vz: U.rand(-0.6, 0.6),
        life: U.rand(0.6, 1.3), s0: U.rand(0.7, 1.5), s1: 0, sm: 0.25, g: 0.8, drag: 1.5, col: colors ? U.pick(colors) : null });
    }
  }
  function bubbles(x, y, z, n = 4) {
    for (let i = 0; i < n; i++) sys.bubble.spawn({ x: x + U.rand(-1, 1), y: y + U.rand(0, 1), z: z + U.rand(-1, 1), vx: U.rand(-0.3, 0.3), vy: U.rand(0.5, 1.2), vz: U.rand(-0.3, 0.3), life: U.rand(1.5, 3), s0: U.rand(0.6, 1.5), s1: 1.1, sm: 0.2, drag: 0.6 });
  }
  function splash(x, y, z, n = 8, spd = 2) {
    for (let i = 0; i < n; i++) sys.water.spawn({ x: x + U.rand(-0.3, 0.3), y, z: z + U.rand(-0.3, 0.3), vx: U.rand(-spd, spd), vy: U.rand(1, 3.5), vz: U.rand(-spd, spd), life: U.rand(0.4, 0.8), s0: U.rand(0.8, 1.6), s1: 0.3, g: 12, floor: 0.05 });
  }
  function rain(x, z, w, d, n = 6) {
    for (let i = 0; i < n; i++) sys.water.spawn({ x: x + U.rand(-w, w), y: U.rand(2.6, 3.0), z: z + U.rand(-d, d), vx: 0, vy: -U.rand(5, 8), vz: 0, life: 0.45, s0: 1.2, s1: 0.9, sy: 3 });
  }
  function sparkles(x, y, z, n = 6, spread = 1.5, col) {
    for (let i = 0; i < n; i++) sys.sparkle.spawn({ x: x + U.rand(-spread, spread), y: y + U.rand(0, 1.2), z: z + U.rand(-spread, spread), vy: U.rand(0.2, 0.8), life: U.rand(0.5, 1.0), s0: U.rand(0.6, 1.3), s1: 0, sm: 0.3, rz: U.rand(0, 3) });
  }
  function confetti(x, y, z, n = 40, power = 6) {
    const cols = [0xff4d5a, 0xffd23f, 0x46c23a, 0x2f8cff, 0xb44cff, 0xff8a1f, 0xffffff];
    for (let i = 0; i < n; i++) sys.confetti.spawn({ x, y, z, vx: U.rand(-power, power) * 0.5, vy: U.rand(power * 0.6, power * 1.2), vz: U.rand(-power, power) * 0.5, life: U.rand(1.4, 2.2), s0: U.rand(1, 1.8), s1: 0.6, g: 9, drag: 1.4, vr: U.rand(-12, 12), col: U.pick(cols), floor: 0.06 });
  }
  function smoke(x, y, z, n = 10, s = 1) {
    for (let i = 0; i < n; i++) sys.smoke.spawn({ x: x + U.rand(-1, 1) * s, y: y + U.rand(0, 1) * s, z: z + U.rand(-1, 1) * s, vx: U.rand(-1.5, 1.5), vy: U.rand(0.5, 2.0), vz: U.rand(-1.5, 1.5), life: U.rand(0.6, 1.1), s0: U.rand(1.2, 2.2) * s, s1: 0, sm: 0.2, drag: 2 });
  }
  function wind(x, z, w, d, n = 3) {
    for (let i = 0; i < n; i++) sys.wind.spawn({ x: x + U.rand(-w, w), y: 3.0, z: z + U.rand(-d, d), vx: U.rand(-0.5, 0.5), vy: -U.rand(6, 9), vz: U.rand(-0.5, 0.5), life: 0.35, s0: 1, s1: 0.5 });
  }
  function coinBurst(x, y, z, n = 6) {
    for (let i = 0; i < n; i++) sys.coin.spawn({ x, y, z, vx: U.rand(-2, 2), vy: U.rand(4, 7), vz: U.rand(-2, 2), life: U.rand(0.8, 1.2), s0: 1.2, s1: 0.8, g: 14, floor: 0.12, vr: U.rand(6, 14) });
  }
  function glow(x, y, z, s = 3, life = 0.5) { sys.glow.spawn({ x, y, z, life, s0: s, s1: 0, sm: 0.2 }); }

  // ---------- stickers ----------
  function addMud(car, n, dirtMul = 1) {
    const surf = car.model.surf, parent = car.model.extras.hover || car.model.inner;
    const out = [];
    const areas = surf.map(p => p.kind === 'top' ? (p.x1 - p.x0) * (p.z1 - p.z0) : (p.x1 - p.x0) * (p.y1 - p.y0) * 2);
    const tot = areas.reduce((a, b) => a + b, 0);
    for (let i = 0; i < n; i++) {
      let r = Math.random() * tot, idx = 0;
      while (r > areas[idx] && idx < areas.length - 1) { r -= areas[idx]; idx++; }
      const p = surf[idx];
      const pos = new THREE.Vector3(), quat = new THREE.Quaternion(), sc = new THREE.Vector3();
      const size = U.rand(0.16, 0.34) * Math.sqrt(dirtMul);
      if (p.kind === 'top') {
        pos.set(U.rand(p.x0, p.x1), p.y + 0.01, U.rand(p.z0, p.z1));
        quat.setFromEuler(new THREE.Euler(0, Math.random() * 6, 0));
        sc.set(size * U.rand(1, 1.6), 0.06, size);
      } else {
        const side = U.chance(0.75) ? 1 : -1;
        pos.set(U.rand(p.x0, p.x1), U.rand(p.y0, p.y1), p.z * side);
        quat.setFromEuler(new THREE.Euler(0, 0, Math.random() * 6));
        sc.set(size * U.rand(1, 1.6), size, 0.06);
      }
      const it = sys.mud.add(parent, pos, quat, sc, U.pick(PAL.mud));
      if (it) out.push(it);
    }
    return out;
  }
  function addCoat(car, n) {
    const surf = car.model.surf, parent = car.model.extras.hover || car.model.inner;
    const out = [];
    for (let i = 0; i < n; i++) {
      const p = U.pick(surf);
      const pos = new THREE.Vector3(), quat = new THREE.Quaternion(), sc = new THREE.Vector3();
      if (p.kind === 'top') pos.set(U.rand(p.x0, p.x1), p.y + 0.05, U.rand(p.z0, p.z1));
      else pos.set(U.rand(p.x0, p.x1), U.rand(p.y0, p.y1 + 0.3), p.z * (U.chance(0.5) ? 1 : -1));
      const s = U.rand(0.22, 0.42);
      sc.set(s, s * U.rand(0.8, 1.1), s);
      const it = sys.coat.add(parent, pos, quat, sc, 0xffffff);
      if (it) { it.k = 0; out.push(it); }
    }
    return out;
  }
  function tintCoat(items, col) { const c = new THREE.Color(col); for (const it of items) it.col = c.clone(); }

  // ---------- flyers ----------
  function fly(obj, from, to, dur, arc = 1.5, done, o = {}) {
    if (!obj.parent) root.add(obj);
    obj.position.copy(from);
    flyers.push({ obj, from: from.clone(), to, dur, arc, done, t: 0, spin: o.spin, ease: o.ease, scaleFrom: o.scaleFrom != null ? o.scaleFrom : 1, scaleTo: o.scaleTo });
  }
  const bundlePool = [];
  function getBundle() {
    const m = bundlePool.pop() || new THREE.Mesh(Models.cashBundleGeo(), MAT.vc);
    m.castShadow = true; m.scale.setScalar(1); m.rotation.set(0, Math.random() * 3, 0); m.visible = true;
    return m;
  }
  function freeBundle(m) { if (m.parent) m.parent.remove(m); bundlePool.push(m); }

  // ---------- DOM: floating text & labels ----------
  function text(pos, html, cls = '', o = {}) {
    const el = document.createElement('div');
    el.className = 'ftext ' + cls;
    el.innerHTML = html;
    labelsEl.appendChild(el);
    texts.push({ el, pos: pos.clone(), t: 0, dur: o.dur || 1.3, rise: o.rise != null ? o.rise : 70, follow: o.follow || null, fy: o.fy || 0 });
  }
  function label(anchor, offY, html, cls = '') {
    const el = document.createElement('div');
    el.className = 'wlabel ' + cls;
    el.innerHTML = html;
    labelsEl.appendChild(el);
    const L = { el, anchor, offY, visible: true, html, pos: new THREE.Vector3(), offX: 0,
      set(h) { if (h !== L.html) { L.html = h; el.innerHTML = h; } },
      show(v) { if (v !== L.visible) { L.visible = v; el.style.display = v ? '' : 'none'; } },
      cls(c, on) { el.classList.toggle(c, on); },
      remove() { el.remove(); const i = labels.indexOf(L); if (i >= 0) labels.splice(i, 1); } };
    labels.push(L);
    return L;
  }
  const _wp = new THREE.Vector3();
  function anchorPos(a, out) {
    if (a.isObject3D) a.getWorldPosition(out);
    else if (typeof a === 'function') out.copy(a());
    else out.copy(a);
    return out;
  }
  function updateDom(dt) {
    for (let i = 0; i < texts.length; i++) {
      const t = texts[i];
      t.t += dt;
      if (t.t >= t.dur) { t.el.remove(); texts.splice(i, 1); i--; continue; }
      if (t.follow) { t.follow.getWorldPosition(t.pos); t.pos.y += t.fy; }
      GFX.project(t.pos, tmp);
      const k = t.t / t.dur;
      const y = tmp.y - U.easeOutCubic(Math.min(1, k * 1.4)) * t.rise;
      t.el.style.transform = `translate3d(${tmp.x.toFixed(1)}px, ${y.toFixed(1)}px, 0) translate(-50%, -50%)`;
      t.el.style.opacity = k > 0.7 ? (1 - (k - 0.7) / 0.3).toFixed(2) : '1';
      t.el.style.display = tmp.vis ? '' : 'none';
    }
    for (const L of labels) {
      if (!L.visible) continue;
      anchorPos(L.anchor, _wp); _wp.y += L.offY;
      GFX.project(_wp, tmp);
      L.el.style.transform = `translate3d(${(tmp.x + L.offX).toFixed(1)}px, ${tmp.y.toFixed(1)}px, 0) translate(-50%, -100%)`;
      L.el.style.visibility = tmp.vis ? 'visible' : 'hidden';
    }
  }
  function clearAll() {
    for (const t of texts) t.el.remove(); texts.length = 0;
    for (const L of labels.slice()) L.remove();
    flyers.length = 0;
    for (const k in sys) { if (sys[k].clear) sys[k].clear(); if (sys[k].items) sys[k].items.length = 0; }
  }

  return { init, update, sys, foamBurst, bubbles, splash, rain, sparkles, confetti, smoke, wind, coinBurst, glow, addMud, addCoat, tintCoat, fly, getBundle, freeBundle, text, label, clearAll, get root() { return root; } };
})();

<script>

  const THEMES = {

      sky: 0x161c38, fog: 0x1d2446, ground: 0x343a45, patch: 0x3c4350, lot: 0xb7bbc4, road: 0x2b2f36, sidewalk: 0x5a606b,
      water: 0x1e3a6b, shore: 0x4a505c, hemi: 0.52, sun: 0.28, sunColor: 0xa9c4ff, hemiSky: 0x9fb5ff, hemiGround: 0x4b4060, amb: 0.18, flora: 'city', night: true,
    },

      sky: 0x05060f, fog: 0x070914, ground: 0x9fa2aa, patch: 0x8d9099, lot: 0xbfc3ca, road: 0x5a5e66, sidewalk: 0xb5b8bf,
      water: null, shore: null, hemi: 0.5, sun: 0.75, sunColor: 0xffffff, hemiSky: 0xc9d4ff, hemiGround: 0x55586a, amb: 0.12, flora: 'moon', stars: true,

  let group = null, theme = null, waterTex = null, snowPts = null, tumble = [], lane2Bits = null, stars = null;
  const lb = () => CFG.lotBounds;

  function build(themeId) {
    clear();
    theme = THEMES[themeId] || THEMES.suburb;
    GFX.setTheme(theme);
    group = new THREE.Group();
    GFX.scene.add(group);
    const L = lb();

    // --- ground ---
    const ground = new THREE.Mesh(new THREE.PlaneGeometry(520, 520), MAT.lam(theme.ground));
    ground.rotation.x = -Math.PI / 2; ground.receiveShadow = true; group.add(ground);
    const pb = new Builder();

    }
    const patches = pb.build(MAT.vc, false); patches.receiveShadow = true; group.add(patches);

    // --- lot slab, curbs ---
    const sb = new Builder();
    const lotTex = TEX.make(512, 512, (ctx, w2, h2) => {
      const base = new THREE.Color(theme.lot);
      ctx.fillStyle = '#' + base.getHexString(); ctx.fillRect(0, 0, w2, h2);
      for (let i = 0; i < 4; i++) for (let j = 0; j < 4; j++) {
        const c = base.clone().offsetHSL(0, 0, U.rand(-0.025, 0.02));
        ctx.fillStyle = '#' + c.getHexString(); ctx.fillRect(i * 128 + 2, j * 128 + 2, 124, 124);
      }
      ctx.fillStyle = 'rgba(0,0,0,0.035)';
      for (let k = 0; k < 900; k++) ctx.fillRect(Math.random() * w2, Math.random() * h2, 2, 2);
      ctx.fillStyle = 'rgba(40,45,55,0.16)';
      for (let i = 0; i <= 4; i++) { ctx.fillRect(i * 128 - 2, 0, 4, h2); ctx.fillRect(0, i * 128 - 2, w2, 4); }

    // --- lane roads (west queue + east exit) ---

      roadStrip(sb, -100, L.x0 + 0.2, z, 4.4, theme.road);

      for (let x = -98; x < 98; x += 6) if (x < L.x0 - 2 || x > L.x1 + 2) sb.box(2.6, 0.012, 0.16, 0xffd23f, { x, y: 0.034, z });

    Models.laneTrack(sb, CFG.laneZ[0], CFG.entranceX - 0.6, CFG.exitX + 0.6);

    // --- main road behind the buildings ---
    const mz = -18.6;
    roadStrip(sb, -120, 120, mz, 7, theme.road);

    sb.box(240, 0.12, 1.5, theme.sidewalk, { x: 0, y: 0.06, z: mz - 4.2 });
    for (let x = -100; x <= 100; x += 13) Models.lamp(sb, x, mz + 4.6, Math.PI / 2, theme.night);
    if (theme.water != null) {
      sb.box(240, 0.1, 2.4, theme.shore, { x: 0, y: 0.03, z: mz - 6.2 });
      const wt = waterTex = TEX.make(256, 256, (ctx, w, h) => {
        ctx.fillStyle = '#' + new THREE.Color(theme.water).getHexString(); ctx.fillRect(0, 0, w, h);
        ctx.strokeStyle = 'rgba(255,255,255,.28)'; ctx.lineWidth = 3;
        for (let i = 0; i < 22; i++) { const x = Math.random() * w, y = Math.random() * h, l = 14 + Math.random() * 30; ctx.beginPath(); ctx.moveTo(x, y); ctx.quadraticCurveTo(x + l / 2, y - 4, x + l, y); ctx.stroke(); }
      });
      wt.wrapS = wt.wrapT = THREE.RepeatWrapping; wt.repeat.set(20, 6);
      const water = new THREE.Mesh(new THREE.PlaneGeometry(260, 70), new THREE.MeshLambertMaterial({ map: wt }));
      water.rotation.x = -Math.PI / 2; water.position.set(0, -0.02, mz - 7.4 - 35); water.receiveShadow = true;
      group.add(water);
    }

    // --- scenery ---
    const tb = new Builder();
    scatterFlora(tb, sb);
    // lot-edge lamps and props
    for (const [x, z] of [[L.x0 + 1, -11.5], [L.x1 - 1, -11.5], [L.x0 + 1, 22], [L.x1 - 1, 22], [-8, 22.6], [8, 22.6]]) Models.lamp(sb, x, z, x < 0 ? 0 : Math.PI, theme.night);
    Models.trafficCone(sb, CFG.exitX + 3.5, 3.1); Models.trafficCone(sb, CFG.exitX + 3.5, -3.1);
    Models.trashCan(sb, -23.2, 22.2); Models.trashCan(sb, 26, -12);
    const scen = tb.build(); scen.castShadow = true; group.add(scen);
    const stat = sb.build(MAT.vc, true); stat.receiveShadow = true; group.add(stat);

    if (theme.night) addNightGlows();
    if (theme.snow) addSnow();
    if (theme.stars) addStars();
    buildLane2Construction();
    return group;
  }

  function inLot(x, z, m = 0) { const L = lb(); return x > L.x0 - m && x < L.x1 + m && z > L.z0 - m && z < L.z1 + m; }
  function onRoad(x, z, m = 0) {
    if (Math.abs(z + 18.6) < 7.2 + m) return true;
    for (const lz of CFG.laneZ) if (Math.abs(z - lz) < 3 + m) return true;
    return false;
  }
  function roadStrip(b, x0, x1, z, w, col) {
    b.box(x1 - x0, 0.02, w, col, { x: (x0 + x1) / 2, y: 0.02, z });
    b.box(x1 - x0, 0.022, 0.14, 0xffffff, { x: (x0 + x1) / 2, y: 0.025, z: z - w / 2 + 0.3 });
    b.box(x1 - x0, 0.022, 0.14, 0xffffff, { x: (x0 + x1) / 2, y: 0.025, z: z + w / 2 - 0.3 });
  }
  function arrowDecal(b, x, z, ry) {
    b.box(1.8, 0.012, 0.4, 0xffffff, { x: x - 0.4, y: 0.045, z });
    b.add(new THREE.CircleGeometry(0.75, 3), 0xffffff, { x: x + 0.7, y: 0.046, z, rx: -Math.PI / 2, rz: 0 });
  }

  function scatterFlora(tb, sb) {
    const L = lb();
    const spots = [];
    const tryPlace = (x, z, r) => {
      if (inLot(x, z, 2.5) || onRoad(x, z, r)) return false;
      if (z < -26 && theme.water != null) return false;
      for (const s of spots) if (U.dist2(s[0], s[1], x, z) < (r + s[2]) * (r + s[2])) return false;
      spots.push([x, z, r]); return true;
    };
    const fl = theme.flora;
    const N = fl === 'city' ? 40 : 170;
    for (let i = 0; i < N * 3 && spots.length < N; i++) {
      const x = U.rand(-90, 95), z = U.rand(-24, 70);
      const near = Math.abs(x) < 50 && z < 40;
      if (!near && Math.random() < 0.5) continue;
      const s = U.rand(0.85, 1.35);
      if (!tryPlace(x, z, 1.8 * s)) continue;
      if (fl === 'oak') { Math.random() < 0.78 ? Models.tree(tb, x, z, s) : Models.bush(tb, x, z, s * 1.2); }
      else if (fl === 'palm') { Math.random() < 0.6 ? Models.palm(tb, x, z, s) : beachProp(tb, x, z); }
      else if (fl === 'cactus') { const r = Math.random(); r < 0.55 ? Models.cactus(tb, x, z, s) : r < 0.85 ? Models.rock(tb, x, z, s * 1.6, U.pick([0xc0703f, 0xb35f34, 0xd08a55])) : mesa(tb, x, z, s); }
      else if (fl === 'pine') { Math.random() < 0.82 ? Models.pine(tb, x, z, s) : Math.random() < 0.5 ? Models.snowman(tb, x, z, s * 0.8) : Models.rock(tb, x, z, s * 1.3, 0xd9e2ee); }
      else if (fl === 'moon') { const r = Math.random(); r < 0.45 ? crater(tb, x, z, s * 2) : r < 0.75 ? Models.rock(tb, x, z, s * 1.4, 0x7d8089) : moonProp(tb, x, z); }
      else if (fl === 'city') { /* handled below */ }
    }
    if (fl === 'city') cityBlocks(tb);
    // a few bushes hugging the lot curb so it reads like the reference
    if (fl === 'oak' || fl === 'palm') {
      for (let x = L.x0 + 2; x < L.x1 - 1; x += 4.2) { if (Math.random() < 0.7) Models.bush(tb, x, L.z1 + 1.4, U.rand(0.8, 1.1)); }
    }
    // tumbleweeds
    tumble = [];
    if (fl === 'cactus') {
      for (let i = 0; i < 4; i++) {
        const m = new THREE.Mesh(GEO.ico(0.55, 1), new THREE.MeshLambertMaterial({ color: 0xb08a55, wireframe: true }));
        m.position.set(U.rand(-60, 60), 0.55, U.rand(26, 40)); group.add(m); tumble.push({ m, v: U.rand(2, 4) });
      }
    }
  }
  function beachProp(b, x, z) {
    const r = Math.random();
    if (r < 0.5) {
      b.cyl(0.05, 0.05, 2.4, 6, 0xffffff, { x, y: 1.2, z });
      const c = U.pick([0xff4d5a, 0x2f8cff, 0xffd23f, 0x46c23a]);
      b.cone(1.5, 0.6, 8, c, { x, y: 2.45, z, flat: true });
      b.box(1.0, 0.04, 1.8, U.pick([0xffffff, 0x6fd3ff, 0xff9ec8]), { x: x + 0.9, y: 0.03, z: z + 0.6, ry: 0.3 });
    } else if (r < 0.75) {
      b.rbox(0.5, 2.2, 0.12, 0.2, U.pick([0xff8a1f, 0x2fc6c6, 0xff6fb1]), { x, y: 1.0, z, rz: 0.2, ry: Math.random() });
    } else {
      b.sphere(0.4, 0xffffff, { x, y: 0.4, z }); b.sphere(0.405, 0xff4d5a, { x, y: 0.4, z, sx: 0.4 });
    }
  }
  function mesa(b, x, z, s) {
    b.cyl(2.2 * s, 2.8 * s, 3.2 * s, 7, 0xc0703f, { x, y: 1.6 * s, z, flat: true });
    b.cyl(2.25 * s, 2.25 * s, 0.4 * s, 7, 0xd08a55, { x, y: 3.25 * s, z, flat: true });
  }
  function crater(b, x, z, s) {
    b.torus(1.1 * s, 0.28 * s, 0x8a8d95, { x, y: 0.04, z, rx: -Math.PI / 2, sz: 0.5, rs: 6, ts: 14, flat: true });
    b.add(GEO.circle(1.0 * s, 14), 0x7d8089, { x, y: 0.02, z, rx: -Math.PI / 2 });
  }
  function moonProp(b, x, z) {
    if (Math.random() < 0.5) {
      b.sphere(1.6, 0xeef1f6, { x, y: 0, z, ws: 14, hs: 8 });
      b.box(0.8, 0.9, 0.5, 0xbfc5d0, { x, y: 0.45, z: z + 1.5 });
    } else {
      b.cyl(0.06, 0.06, 2.6, 6, 0xd9dde4, { x, y: 1.3, z });
      b.cone(0.7, 0.35, 12, 0xeef1f6, { x, y: 2.7, z, rx: Math.PI * 0.8 });
    }
  }
  function cityBlocks(tb) {
    const L = lb();
    const cols = [0x4a5168, 0x3d4459, 0x55607a, 0x46405e, 0x384a5e];
    for (let x = -90; x < 95; x += U.rand(7, 11)) {
      const h = U.rand(8, 26), w = U.rand(5, 9), d = U.rand(5, 8);
      Models.tallBuilding(tb, x, -30 - d / 2 - U.rand(0, 6), w, d, h, U.pick(cols), true);
      if (x < L.x0 - 8 || x > L.x1 + 8) Models.tallBuilding(tb, x, U.rand(30, 45), w, d, h * 0.8, U.pick(cols), true);
    }
    for (let z = -6; z < 40; z += U.rand(8, 12)) {
      for (const x of [-48, 52]) Models.tallBuilding(tb, x + U.rand(-4, 4), z, U.rand(6, 9), U.rand(6, 9), U.rand(8, 22), U.pick(cols), true);
    }
    for (let x = L.x0 - 6; x > -95; x -= 9) for (const z of [5.5, 7.5]) if (Math.random() < 0.6) { tb.rbox(1.3, 0.6, 1.3, 0.1, 0x6f7783, { x, y: 0.3, z }); Models.tree(tb, x, z, 0.6, 0x3c9a4a); }
  }
  function addNightGlows() {
    const mat = new THREE.MeshBasicMaterial({ map: TEX.glow(), transparent: true, depthWrite: false, blending: THREE.AdditiveBlending, color: 0xffd99a, opacity: 0.55 });
    const L = lb();
    const pts = [];
    for (let x = -100; x <= 100; x += 13) pts.push([x + 0.95 * 0, -18.6 + 4.6]);
    pts.push([L.x0 + 1, -11.5], [L.x1 - 1, -11.5], [L.x0 + 1, 22], [L.x1 - 1, 22], [-8, 22.6], [8, 22.6]);
    for (const [x, z] of pts) {
      const m = new THREE.Mesh(GEO.plane(9, 9), mat); m.rotation.x = -Math.PI / 2; m.position.set(x, 0.06, z); group.add(m);
    }
    // neon strips along the lot edge
    const neon = [0xff3df2, 0x3df2ff, 0xfff23d];
    for (let i = 0; i < 3; i++) {
      const s = new THREE.Mesh(GEO.box(L.x1 - L.x0, 0.1, 0.1), new THREE.MeshBasicMaterial({ color: neon[i] }));
      s.position.set((L.x0 + L.x1) / 2, 0.62 + i * 0.001, L.z1 + 0.2 + i * 0.12); group.add(s);
    }
  }
  function addSnow() {
    const n = 1400, pos = new Float32Array(n * 3);
    for (let i = 0; i < n; i++) { pos[i * 3] = U.rand(-45, 45); pos[i * 3 + 1] = U.rand(0, 30); pos[i * 3 + 2] = U.rand(-35, 45); }
    const g = new THREE.BufferGeometry(); g.setAttribute('position', new THREE.BufferAttribute(pos, 3));
    snowPts = new THREE.Points(g, new THREE.PointsMaterial({ color: 0xffffff, size: 0.28, transparent: true, opacity: 0.9, depthWrite: false }));
    snowPts.frustumCulled = false;
    group.add(snowPts);
  }
  function addStars() {
    const n = 900, pos = new Float32Array(n * 3);
    for (let i = 0; i < n; i++) {
      const a = Math.random() * Math.PI * 2, el = U.rand(0.02, 1.2), r = 300;
      pos[i * 3] = Math.cos(a) * Math.cos(el) * r; pos[i * 3 + 1] = Math.sin(el) * r; pos[i * 3 + 2] = Math.sin(a) * Math.cos(el) * r;
    }
    const g = new THREE.BufferGeometry(); g.setAttribute('position', new THREE.BufferAttribute(pos, 3));
    stars = new THREE.Points(g, new THREE.PointsMaterial({ color: 0xffffff, size: 1.6, sizeAttenuation: false, fog: false }));
    group.add(stars);
    const earth = new THREE.Mesh(GEO.sphere(14, 24, 16), new THREE.MeshBasicMaterial({ color: 0x3f8cff, fog: false }));
    earth.position.set(-120, 90, -220); group.add(earth);
    const land = new THREE.Mesh(GEO.sphere(14.2, 10, 8), new THREE.MeshBasicMaterial({ color: 0x46c23a, fog: false, wireframe: false, transparent: true, opacity: 0.55 }));
    land.position.copy(earth.position); land.scale.set(1, 0.7, 0.6); group.add(land);
  }

  // Lane 2 sits behind cones and a sign until it is bought.
  function buildLane2Construction() {
    lane2Bits = new THREE.Group();
    const b = new Builder();
    const z = CFG.laneZ[1];
    for (let i = 0; i < 9; i++) Models.trafficCone(b, -14 + i * 4.2, z + (i % 2 ? 1.2 : -1.2), 1.1);
    for (const x of [lb().x0 + 1.2, lb().x1 - 1.2]) {
      b.box(0.2, 1.0, 0.2, 0xffffff, { x, y: 0.5, z: z - 1.9 }); b.box(0.2, 1.0, 0.2, 0xffffff, { x, y: 0.5, z: z + 1.9 });
      for (let i = 0; i < 6; i++) b.box(0.22, 0.32, 0.66, i % 2 ? 0xffffff : 0xe8383d, { x, y: 0.9, z: z - 1.65 + i * 0.66 });
    }
    lane2Bits.add(b.build());
    const s = Models.signBoard('LANE 2 SOON', 4.4, 1.0, '#ff8a1f', '#ffffff', 'lane');
    s.position.set(-4, 2.6, z); s.rotation.y = GFX.cam.yaw * 0.5;
    const pb = new Builder(); pb.cyl(0.08, 0.08, 2.2, 6, 0x7d8796, { x: -5.5, y: 1.1, z }); pb.cyl(0.08, 0.08, 2.2, 6, 0x7d8796, { x: -2.5, y: 1.1, z });
    lane2Bits.add(s, pb.build());
    group.add(lane2Bits);
  }
  function openLane2() {
    if (lane2Bits) { group.remove(lane2Bits); lane2Bits = null; }
    const b = new Builder();
    Models.laneTrack(b, CFG.laneZ[1], CFG.entranceX - 0.6, CFG.exitX + 0.6);
    const m = b.build(MAT.vc, false); m.receiveShadow = true; group.add(m);
  }

  function update(dt, t) {
    if (waterTex) { waterTex.offset.x += dt * 0.012; waterTex.offset.y += dt * 0.006; }
    if (snowPts) {
      const p = snowPts.geometry.attributes.position, c = GFX.camera.position;
      for (let i = 0; i < p.count; i++) {
        let y = p.getY(i) - dt * 2.2, x = p.getX(i) + Math.sin(t + i) * dt * 0.4;
        if (y < 0) { y = 30; }
        p.setXYZ(i, x, y, p.getZ(i));
      }
      p.needsUpdate = true;
      snowPts.position.set(Math.round(c.x / 10) * 10 - 10, 0, Math.round(c.z / 10) * 10 - 30);
    }
    for (const tw of tumble) {
      tw.m.position.x += tw.v * dt; tw.m.rotation.z -= tw.v * dt / 0.55;
      tw.m.position.y = 0.55 + Math.abs(Math.sin(t * 3 + tw.v)) * 0.5;
      if (tw.m.position.x > 70) tw.m.position.x = -70;
    }
  }

  function clear() {
    if (group) {
      GFX.scene.remove(group);
      group.traverse(o => { if (o.geometry && !o.geometry.parameters) o.geometry.dispose(); });
    }
    group = null; snowPts = null; stars = null; waterTex = null; tumble = []; lane2Bits = null;
  }

  return { build, update, clear, openLane2, THEMES, get theme() { return theme; }, get group() { return group; } };
})();
