// ---- js/nav.js ----
// nav.js — grid A* over the lot so staff walk around machines, racks and buildings.
const Nav = (() => {
  const cs = 0.5;
  let x0 = 0, z0 = 0, w = 1, h = 1, grid = new Uint8Array(1);
  const colliders = [];

  function init(b) {
    x0 = b.x0; z0 = b.z0;
    w = Math.ceil((b.x1 - b.x0) / cs); h = Math.ceil((b.z1 - b.z0) / cs);
    grid = new Uint8Array(w * h);
  }
  function setColliders(list) { colliders.length = 0; colliders.push(...list); rebuild(); }
  function rebuild(pad = 0.38) {
    grid.fill(0);
    for (const c of colliders) {
      const i0 = Math.max(0, Math.floor((c.x0 - pad - x0) / cs)), i1 = Math.min(w - 1, Math.floor((c.x1 + pad - x0) / cs));
      const j0 = Math.max(0, Math.floor((c.z0 - pad - z0) / cs)), j1 = Math.min(h - 1, Math.floor((c.z1 + pad - z0) / cs));
      for (let j = j0; j <= j1; j++) for (let i = i0; i <= i1; i++) grid[j * w + i] = 1;
    }
  }
  const ci = (x) => Math.floor((x - x0) / cs), cj = (z) => Math.floor((z - z0) / cs);
  const blocked = (i, j) => i < 0 || j < 0 || i >= w || j >= h || grid[j * w + i] === 1;
  const cx = (i) => x0 + (i + 0.5) * cs, cz = (j) => z0 + (j + 0.5) * cs;

  function nearestFree(i, j) {
    if (!blocked(i, j)) return [i, j];
    for (let r = 1; r < 30; r++) {
      for (let dj = -r; dj <= r; dj++) for (let di = -r; di <= r; di++) {
        if (Math.abs(di) !== r && Math.abs(dj) !== r) continue;
        if (!blocked(i + di, j + dj)) return [i + di, j + dj];
      }
    }
    return [i, j];
  }
  function los(ax, az, bx, bz) {
    const d = Math.hypot(bx - ax, bz - az), n = Math.ceil(d / (cs * 0.5));
    for (let k = 1; k < n; k++) {
      const t = k / n, x = ax + (bx - ax) * t, z = az + (bz - az) * t;
      if (blocked(ci(x), cj(z))) return false;
    }
    return true;
  }
  // binary heap keyed by f
  function find(ax, az, bx, bz) {
    let [si, sj] = nearestFree(ci(ax), cj(az));
    let [ti, tj] = nearestFree(ci(bx), cj(bz));
    if (si === ti && sj === tj) return [{ x: bx, z: bz }];
    if (los(ax, az, bx, bz) && !blocked(ci(bx), cj(bz))) return [{ x: bx, z: bz }];
    const N = w * h;
    const g = new Float32Array(N).fill(Infinity), came = new Int32Array(N).fill(-1), closed = new Uint8Array(N);
    const heap = [], hf = [];
    const push = (n, f) => { heap.push(n); hf.push(f); let k = heap.length - 1; while (k > 0) { const p = (k - 1) >> 1; if (hf[p] <= hf[k]) break; [heap[p], heap[k]] = [heap[k], heap[p]]; [hf[p], hf[k]] = [hf[k], hf[p]]; k = p; } };
    const pop = () => { const top = heap[0], last = heap.pop(), lf = hf.pop(); if (heap.length) { heap[0] = last; hf[0] = lf; let k = 0; for (;;) { const l = 2 * k + 1, r = l + 1; let m = k; if (l < heap.length && hf[l] < hf[m]) m = l; if (r < heap.length && hf[r] < hf[m]) m = r; if (m === k) break; [heap[m], heap[k]] = [heap[k], heap[m]]; [hf[m], hf[k]] = [hf[k], hf[m]]; k = m; } } return top; };
    const H = (i, j) => { const dx = Math.abs(i - ti), dz = Math.abs(j - tj); return (dx + dz) + (Math.SQRT2 - 2) * Math.min(dx, dz); };
    const s = sj * w + si, t = tj * w + ti;
    g[s] = 0; push(s, H(si, sj));
    let found = false, iter = 0;
    while (heap.length && iter++ < 20000) {
      const cur = pop();
      if (cur === t) { found = true; break; }
      if (closed[cur]) continue;
      closed[cur] = 1;
      const i = cur % w, j = (cur / w) | 0;
      for (let dj = -1; dj <= 1; dj++) for (let di = -1; di <= 1; di++) {
        if (!di && !dj) continue;
        const ni = i + di, nj = j + dj;
        if (blocked(ni, nj)) continue;
        if (di && dj && (blocked(i + di, j) || blocked(i, j + dj))) continue;
        const n = nj * w + ni;
        if (closed[n]) continue;
        const ng = g[cur] + (di && dj ? Math.SQRT2 : 1);
        if (ng < g[n]) { g[n] = ng; came[n] = cur; push(n, ng + H(ni, nj)); }
      }
    }
    if (!found) return [{ x: bx, z: bz }];
    const cells = [];
    for (let c = t; c !== -1 && c !== s; c = came[c]) cells.push(c);
    cells.reverse();
    const pts = cells.map(c => ({ x: cx(c % w), z: cz((c / w) | 0) }));
    pts[pts.length - 1] = { x: bx, z: bz };
    // string pulling
    const out = [];
    let ax2 = ax, az2 = az, k = 0;
    while (k < pts.length) {
      let far = k;
      for (let m = pts.length - 1; m > k; m--) if (los(ax2, az2, pts[m].x, pts[m].z)) { far = m; break; }
      out.push(pts[far]); ax2 = pts[far].x; az2 = pts[far].z; k = far + 1;
    }
    return out;
  }
  // push a circle out of all colliders (used for the manager and to un-stick staff)
  function resolve(p, r) {
    for (const c of colliders) {
      const nx = U.clamp(p.x, c.x0, c.x1), nz = U.clamp(p.z, c.z0, c.z1);
      const dx = p.x - nx, dz = p.z - nz, d2 = dx * dx + dz * dz;
      if (d2 < r * r) {
        if (d2 > 1e-6) { const d = Math.sqrt(d2), k = (r - d) / d; p.x += dx * k; p.z += dz * k; }
        else { // centre inside: push out along the shallowest axis
          const l = p.x - c.x0, rr = c.x1 - p.x, t = p.z - c.z0, b = c.z1 - p.z, m = Math.min(l, rr, t, b);
          if (m === l) p.x = c.x0 - r; else if (m === rr) p.x = c.x1 + r; else if (m === t) p.z = c.z0 - r; else p.z = c.z1 + r;
        }
      }
    }
  }
  return { init, setColliders, rebuild, find, los, resolve, get colliders() { return colliders; }, blockedAt: (x, z) => blocked(ci(x), cj(z)) };
})();

// entities.js — the manager, staff, the stacks they carry, and customer cars.

// ---------------------------------------------------------------------------
// A stack of supplies carried in front of a person (Pizza-Ready style).
// ---------------------------------------------------------------------------
class CarryStack {
  constructor(owner, capFn) {
    this.owner = owner; this.capFn = capFn;
    this.items = [];      // { type, mesh, landed }
    this.holder = new THREE.Group();
    this.holder.position.set(0, 0.98, 0.5);
    owner.model.body.add(this.holder);
    this.sway = 0;
  }
  get count() { return this.items.length; }
  get cap() { return this.capFn(); }
  get full() { return this.items.length >= this.cap; }
  countOf(type) { let n = 0; for (const it of this.items) if (it.type === type) n++; return n; }
  slotWorld(i, out) { out.set(0, i * 0.44, 0); return this.holder.localToWorld(out); }
  add(type, fromWorld) {
    const mesh = Models.item(type);
    const it = { type, mesh, landed: false };
    const idx = this.items.length;
    this.items.push(it);
    const tmp = new THREE.Vector3();
    FX.fly(mesh, fromWorld, () => this.slotWorld(this.items.indexOf(it) >= 0 ? this.items.indexOf(it) : idx, tmp), 0.22, 0.9, () => {
      if (this.items.indexOf(it) < 0) { if (mesh.parent) mesh.parent.remove(mesh); return; }
      this.holder.add(mesh); mesh.rotation.set(0, 0, 0); it.landed = true; this.layout();
    }, { spin: 8 });
    return it;
  }
  // remove the top-most item of a type; returns its world position (mesh is flown elsewhere by caller)
  take(type) {
    for (let i = this.items.length - 1; i >= 0; i--) {
      if (this.items[i].type !== type) continue;
      const it = this.items[i];
      this.items.splice(i, 1);
      const wp = new THREE.Vector3();
      it.mesh.getWorldPosition(wp);
      if (it.mesh.parent) it.mesh.parent.remove(it.mesh);
      this.layout();
      return { mesh: it.mesh, pos: wp };
    }
    return null;
  }
  clear() { for (const it of this.items) if (it.mesh.parent) it.mesh.parent.remove(it.mesh); this.items.length = 0; }
  layout() {
    this.items.forEach((it, i) => { if (it.landed) it.mesh.position.set(0, i * 0.44, 0); });
  }
  update(dt, speed01) {
    this.sway = U.damp(this.sway, speed01, 5, dt);
    const t = performance.now() / 1000;
    this.items.forEach((it, i) => {
      if (!it.landed) return;
      it.mesh.position.z = -this.sway * i * 0.035 + Math.sin(t * 9 + i * 0.6) * 0.008 * i * this.sway;
      it.mesh.position.x = Math.sin(t * 7 + i * 0.5) * 0.01 * i * this.sway;
      it.mesh.position.y = U.damp(it.mesh.position.y, i * 0.44, 18, dt);
    });
  }
}

// ---------------------------------------------------------------------------
// The manager (player character)
// ---------------------------------------------------------------------------
class Player {
  constructor() {
    this.model = Models.person({ shirt: 0xffffff, vest: PAL.blue, star: true, badge: true, hat: Store.s.hats.on, scale: 1.08 });
    this.pos = new THREE.Vector3(CFG.playerStart[0], 0, CFG.playerStart[1]);
    this.vel = new THREE.Vector3();
    this.facing = Math.PI;
    this.radius = 0.45;
    this.stack = new CarryStack(this, () => Game.mgrCarry());
    this.moveDir = new THREE.Vector3();
    GFX.scene.add(this.model.group);
    this.maxLabel = FX.label(() => this.stackTop(), 0.4, '<span class="carry-cnt max">MAX</span>', '');
    this.maxLabel.show(false);
    this.shadow = blobShadow(1.2); GFX.scene.add(this.shadow);
    this.idleT = 0;
  }
  stackTop() { const v = new THREE.Vector3(); this.stack.slotWorld(this.stack.count, v); return v; }
  get speed01() { return U.clamp(this.vel.length() / Game.mgrSpeed(), 0, 1); }
  update(dt, input) {
    const spd = Game.mgrSpeed();
    const want = this.moveDir.set(input.x, 0, input.z);
    const mag = Math.min(1, want.length());
    if (mag > 0.01) want.normalize().multiplyScalar(spd * mag);
    const k = mag > 0.01 ? 14 : 18;
    this.vel.x = U.damp(this.vel.x, want.x, k, dt);
    this.vel.z = U.damp(this.vel.z, want.z, k, dt);
    this.pos.x += this.vel.x * dt; this.pos.z += this.vel.z * dt;
    const B = CFG.walkBounds;
    this.pos.x = U.clamp(this.pos.x, B.x0, B.x1); this.pos.z = U.clamp(this.pos.z, B.z0, B.z1);
    Nav.resolve(this.pos, this.radius);
    if (this.vel.lengthSq() > 0.05) this.facing = U.angleLerp(this.facing, Math.atan2(this.vel.x, this.vel.z), 1 - Math.exp(-14 * dt));
    this.model.group.position.copy(this.pos);
    this.model.group.rotation.y = this.facing;
    const s01 = this.speed01;
    this.model.animate(dt, s01, this.stack.count > 0, Game.polishingPlayer ? 'polish' : null);
    this.stack.update(dt, s01);
    this.maxLabel.show(this.stack.full && this.stack.count > 0);
    this.shadow.position.set(this.pos.x, 0.03, this.pos.z);
    if (s01 < 0.05) this.idleT += dt; else this.idleT = 0;
  }
  near(x, z, r) { return U.dist2(this.pos.x, this.pos.z, x, z) < r * r; }
}

function blobShadow(size) {
  const m = new THREE.Mesh(GEO.plane(size, size), new THREE.MeshBasicMaterial({ map: TEX.soft(), transparent: true, depthWrite: false, opacity: 0.5 }));
  m.rotation.x = -Math.PI / 2;
  return m;
}

// ---------------------------------------------------------------------------
// Staff: stocker / cashier / polisher / turbo (temporary super stocker)
// ---------------------------------------------------------------------------
class Worker {
  constructor(role, o = {}) {
    this.role = role; this.lane = o.lane != null ? o.lane : null; this.name = o.name || 'Worker';
    this.turbo = role === 'turbo';
    const looks = {
      stocker: { shirt: 0x4f8cff, vest: 0xff8a1f },
      cashier: { shirt: 0xffffff, vest: 0x46c23a },
      polisher: { shirt: 0xb44cff, vest: 0xffc93c },
      turbo: { shirt: 0xffd23f, vest: 0xff4d5a, cap: 0xffc92e },
    }[role];
    this.model = Models.person(Object.assign({ skin: U.pick(PAL.skin), pants: 0x2f4f9e }, looks, { hat: this.turbo ? 'cap' : 'cap', cap: looks.cap || PAL.blue }));
    const door = Game.staffDoor();
    this.pos = new THREE.Vector3(door.x + U.rand(-0.5, 0.5), 0, door.z + U.rand(0, 0.6));
    this.facing = 0;
    this.path = []; this.state = 'idle'; this.wait = 0;
    this.stack = new CarryStack(this, () => (this.turbo ? 10 : Game.staffCarry()));
    this.napIn = U.rand(70, 140); this.napping = false; this.napT = 0;
    this.speedNow = 0; this.task = null; this.atPost = false; this.loadT = 0; this.stuck = 0;
    GFX.scene.add(this.model.group);
    this.shadow = blobShadow(1.1); GFX.scene.add(this.shadow);
    this.tag = FX.label(this.model.group, 2.3, `<span class="name-tag">${this.name}</span>`, '');
    this.zzz = FX.label(this.model.group, 2.0, '<span class="zzz">z z Z</span>', '');
    this.zzz.show(false);
    this.life = this.turbo ? CFG.boosts.turbo.add : Infinity;
    this.model.group.position.copy(this.pos);
  }
  get spd() { return this.turbo ? 9 : Game.staffSpeed(); }
  goTo(x, z) { this.path = Nav.find(this.pos.x, this.pos.z, x, z); this.goal = { x, z }; this.stuck = 0; }
  walk(dt) {
    if (!this.path.length) { this.speedNow = U.damp(this.speedNow, 0, 10, dt); return true; }
    const p = this.path[0], dx = p.x - this.pos.x, dz = p.z - this.pos.z, d = Math.hypot(dx, dz);
    const step = this.spd * dt;
    if (d <= step) { this.pos.x = p.x; this.pos.z = p.z; this.path.shift(); }
    else { this.pos.x += (dx / d) * step; this.pos.z += (dz / d) * step; this.facing = U.angleLerp(this.facing, Math.atan2(dx, dz), 1 - Math.exp(-12 * dt)); }
    this.speedNow = U.damp(this.speedNow, 1, 10, dt);
    return !this.path.length;
  }
  sleep() {
    if (this.turbo || this.napping) return;
    this.napping = true; this.napT = U.rand(8, 14); this.zzz.show(true);
    if (Game.player.near(this.pos.x, this.pos.z, 9)) Sfx.play.snore();
    Bus.emit('worker:nap', this);
  }
  wake(byPlayer) {
    if (!this.napping) return;
    this.napping = false; this.zzz.show(false);
    this.napIn = U.rand(70, 140) / Game.napMul();
    this.model.body.rotation.x = 0;
    if (byPlayer) { Sfx.play.wake(); FX.text(this.pos.clone().setY(2.4), '!', 'big', { dur: 0.7, rise: 30 }); Bus.emit('worker:woke', this); }
  }
  update(dt) {
    if (this.turbo) {
      this.life -= dt;
      if (this.life <= 0) { this.dismiss(); return; }
    }
    // naps
    if (this.napping) {
      this.napT -= dt;
      this.model.animate(dt, 0, this.stack.count > 0, 'sleep');
      if (Game.player.near(this.pos.x, this.pos.z, 2.2)) this.wake(true);
      else if (this.napT <= 0) this.wake(false);
      this.sync(); return;
    }
    if (!this.turbo) { this.napIn -= dt * Game.napMul(); if (this.napIn <= 0) { this.sleep(); this.sync(); return; } }
    if (this.role === 'stocker' || this.role === 'turbo') this.stockerAI(dt);
    else this.postAI(dt);
    this.sync();
  }
  sync() {
    this.model.group.position.copy(this.pos);
    this.model.group.rotation.y = this.facing;
    const extra = this.napping ? 'sleep' : (this.role === 'polisher' && this.atPost && this.post && this.post.busy) ? 'polish' : null;
    if (!this.napping) this.model.animate(1 / 60, this.speedNow, this.stack.count > 0, extra);
    this.stack.update(1 / 60, this.speedNow);
    this.shadow.position.set(this.pos.x, 0.03, this.pos.z);
  }
  // cashier / polisher: walk to the post and stay there
  postAI(dt) {
    const st = Game.postFor(this.role, this.lane);
    this.post = st;
    if (!st) { this.atPost = false; return; }
    const spot = st.operatorSpot;
    if (!this.atPost) {
      if (!this.path.length || !this.goal || U.dist2(this.goal.x, this.goal.z, spot.x, spot.z) > 0.01) this.goTo(spot.x, spot.z);
      if (this.walk(dt) || U.dist2(this.pos.x, this.pos.z, spot.x, spot.z) < 0.04) { this.atPost = true; this.path = []; }
    } else {
      this.speedNow = U.damp(this.speedNow, 0, 10, dt);
      this.facing = U.angleLerp(this.facing, st.operatorFacing, 1 - Math.exp(-8 * dt));
      if (U.dist2(this.pos.x, this.pos.z, spot.x, spot.z) > 0.25) this.atPost = false;
    }
  }
  stockerAI(dt) {
    if (this.wait > 0) { this.wait -= dt; this.speedNow = U.damp(this.speedNow, 0, 10, dt); return; }
    switch (this.state) {
      case 'idle': {
        const t = Game.pickStockTask(this);
        if (t) {
          this.task = t; t.hopper.incoming += t.amount;
          if (this.stack.countOf(t.supply) >= 1) { this.state = 'toHopper'; this.goTo(t.hopper.mat.x, t.hopper.mat.z); }
          else { this.state = 'toRack'; this.goTo(t.rack.mat.x, t.rack.mat.z); }
        } else if (this.stack.count) {
          // carrying leftovers nobody needs right now: wait near the racks
          this.state = 'wander'; this.goTo(U.rand(-10, 6), U.rand(4.6, 5.6)); this.wait = 0;
        } else { this.state = 'wander'; this.goTo(U.rand(-14, 8), U.rand(4.5, 5.8)); }
        break;
      }
      case 'wander':
        if (this.walk(dt)) { this.wait = U.rand(1.0, 2.5); this.state = 'idle'; }
        break;
      case 'toRack':
        if (this.walk(dt)) { this.state = 'loading'; this.loadT = 0; this.waitedRack = 0; }
        break;
      case 'loading': {
        const r = this.task.rack;
        this.speedNow = U.damp(this.speedNow, 0, 10, dt);
        this.facing = U.angleLerp(this.facing, Math.PI * 0, 1 - Math.exp(-8 * dt));
        this.loadT -= dt;
        const have = this.stack.countOf(this.task.supply);
        if (have >= this.task.amount || this.stack.full) { this.state = 'toHopper'; this.goTo(this.task.hopper.mat.x, this.task.hopper.mat.z); break; }
        if (this.loadT <= 0 && r.stock > 0) { const p = r.take(); if (p) { this.stack.add(this.task.supply, p); Sfx.play.pop(); } this.loadT = this.turbo ? 0.06 : 0.14; }
        if (r.stock <= 0) { this.waitedRack += dt; if (this.waitedRack > 3 && have > 0) { this.state = 'toHopper'; this.goTo(this.task.hopper.mat.x, this.task.hopper.mat.z); } }
        break;
      }
      case 'toHopper':
        if (this.walk(dt)) { this.state = 'unloading'; this.loadT = 0; }
        break;
      case 'unloading': {
        const h = this.task.hopper;
        this.speedNow = U.damp(this.speedNow, 0, 10, dt);
        this.facing = U.angleLerp(this.facing, Math.PI, 1 - Math.exp(-8 * dt));
        this.loadT -= dt;
        if (this.loadT <= 0) {
          if (h.count < h.cap && this.stack.countOf(this.task.supply) > 0) {
            const it = this.stack.take(this.task.supply);
            h.receive(it); h.incoming = Math.max(0, h.incoming - 1); this.task.amount--;
            this.loadT = this.turbo ? 0.06 : 0.12;
          } else {
            h.incoming = Math.max(0, h.incoming - Math.max(0, this.task.amount)); this.task = null; this.state = 'idle';
          }
        }
        break;
      }
    }
  }
  dropTask() { if (this.task) { this.task.hopper.incoming = Math.max(0, this.task.hopper.incoming - Math.max(0, this.task.amount)); this.task = null; } }
  dismiss() {
    this.dropTask();
    FX.smoke(this.pos.x, 0.8, this.pos.z, 8, 0.6); Sfx.play.poof();
    this.destroy();
    Game.removeWorker(this);
  }
  destroy() {
    this.stack.clear();
    GFX.scene.remove(this.model.group); GFX.scene.remove(this.shadow);
    this.tag.remove(); this.zzz.remove();
  }
}

// ---------------------------------------------------------------------------
// Customer cars
// ---------------------------------------------------------------------------
const PAINT_FOR = {
  taxi: 0xffc93c, police: 0xf5f6fa, icecream: 0xf5f6fa, limo: 0x22252c, duck: 0xffd23f, hotdog: 0xd9a066, ufo: 0xc8d0dc,
  rover: 0xf2f4f8, snowplow: 0xff8a1f, tractor: 0x46c23a, golden: 0xffc92e, pizza: 0xe8383d, buggy: null, sports: null, monster: null,
};
class Car {
  constructor(type, lane, o = {}) {
    this.type = type; this.def = CFG.cars[type]; this.lane = lane;
    const paint = PAINT_FOR[type] != null ? PAINT_FOR[type] : U.pick(CFG.paintColors);
    this.paint = new THREE.Color(paint);
    this.model = Models.car(type, paint);
    this.group = this.model.group;
    GFX.scene.add(this.group);
    this.x = o.x != null ? o.x : CFG.spawnX - U.rand(0, 6); this.z = lane.z;
    this.v = CFG.roadSpeed * 0.8;
    this.state = 'drive'; this.stop = null; this.doneX = -Infinity;
    this.patMax = Game.patience(this.def); this.patience = this.patMax; this.waited = 0;
    this.bill = 0; this.stages = 0; this.dirt = 1; this.shine = 0;
    this.golden = type === 'golden'; this.goldenMult = this.golden ? 3 : 1;
    this.vip = !!this.def.vip;
    this.mood = 'happy';
    const nMud = Math.round(U.rand(10, 15) * (this.def.dirt || 1));
    this.mud = FX.addMud(this, nMud, this.def.dirt || 1);
    this.coat = [];
    this.model.extras.washMe.visible = this.model.extras.washMe.visible && Math.random() < 0.55;
    this.dustTint();
    this.label = FX.label(this.group, this.model.h + 0.75, '', '');
    this.sayLbl = null; this.sayT = 0; this.honkT = U.rand(4, 9);
    this.bounce = 0; this.wheelSpin = 0;
    this.flies = (this.def.dirt || 1) > 1.2 || Math.random() < 0.25 ? this.makeFlies() : null;
    this.group.position.set(this.x, 0, this.z);
    this.group.rotation.y = 0;
    this.t = Math.random() * 10;
    if (this.golden) { this.goldLbl = FX.label(this.group, this.model.h + 1.6, `<div class="st-badge info" style="background:#d99a00">${ICONS.html('golden')}GOLDEN x${this.goldenMult}</div>`, ''); }
    this.updateLabel(true);
  }
  makeFlies() {
    const g = new THREE.Group();
    for (let i = 0; i < 3; i++) { const f = new THREE.Mesh(GEO.sphere(0.06, 6, 4), MAT.lam(0x1b1b1b)); g.add(f); }
    this.group.add(g); g.position.y = this.model.h + 0.3;
    return g;
  }
  dustTint() {
    const d = U.clamp(this.dirt, 0, 1);
    const dusty = this.paint.clone().lerp(new THREE.Color(0x8b6a3e), 0.45);
    this.model.paintMat.color.copy(this.paint).lerp(dusty, d);
    if (!this.golden) this.model.paintMat.emissive.setRGB(0.12 * this.shine, 0.12 * this.shine, 0.13 * this.shine);
  }
  setMud(target) { for (const m of this.mud) m.target = Math.min(m.target, target); }
  addFoam() { if (!this.coat.length) this.coat = FX.addCoat(this, Math.round(this.model.len * 7)); }
  clearFoam() { for (const c of this.coat) { c.target = 0; c.dead = true; } this.coat = []; }
  // --- queue + line movement (lanes run along +x) ---
  moveTo(tx, dt, vmax, acc = 9) {
    const d = tx - this.x;
    if (d <= 0.01) { this.x = Math.max(this.x, Math.min(this.x, tx)); this.v = 0; return true; }
    const vt = Math.min(vmax, Math.sqrt(2 * 7 * d) + 0.2);
    this.v = this.v < vt ? Math.min(vt, this.v + acc * dt) : vt;
    this.x = Math.min(tx, this.x + this.v * dt);
    return tx - this.x < 0.02;
  }
  // Lanes are conveyors: each car drives toward its next unvisited station but never closer than a
  // safe gap to the car ahead, and only occupies a station while it is stopped there.
  ahead() { const a = this.lane.cars, i = a.indexOf(this); return i > 0 ? a[i - 1] : null; }
  nextStation() { const s = this.lane.stops(); for (const st of s) if (st.x > this.doneX + 0.1) return st; return null; }
  get waiting() { return this.x < CFG.entranceX - 0.3 && this.state === 'drive'; }
  update(dt) {
    this.t += dt;
    const L = this.lane;
    if (this.state === 'drive') {
      const st = this.nextStation();
      let tx = st ? st.x : CFG.despawnX + 20;
      const a = this.ahead();
      if (a && !a.dead) tx = Math.min(tx, a.x - ((a.model.len + this.model.len) / 2 + 0.9));
      const far = (st ? st.x : tx) - this.x;
      const vmax = this.x < CFG.entranceX - 4 ? CFG.roadSpeed : (far > 7 ? CFG.lineSpeed * 2.1 : CFG.lineSpeed);
      if (tx > this.x) this.moveTo(tx, dt, vmax, this.x < CFG.entranceX ? 9 : 6);
      else this.v = U.damp(this.v, 0, 12, dt);
      if (!st) { this.leave(); }
      else if (Math.abs(this.x - st.x) < 0.06 && (!st.occupant || st.occupant === this)) {
        if (!st.occupant) { st.occupant = this; this.bounce = 1; if (st === L.firstStop()) this.enteredLine(); }
        if (st.tryStart(this)) { this.state = 'proc'; this.stop = st; }
        else this.waited += dt * 0.5;
      }
      // patience only drains while waiting outside the entrance
      if (this.waiting && this.x > CFG.entranceX - 45 && this.v < 0.8) {
        this.waited += dt;
        this.patience -= dt * (Game.rushHour ? 0.6 : 1);
        this.honkT -= dt;
        if (this.patience < this.patMax * 0.45 && this.honkT <= 0) { this.honk(); this.honkT = U.rand(4, 8); }
        if (this.patience <= 0) { this.rageQuit(); return; }
        if (!this.sayLbl && this.waited > 2 && Math.random() < dt * 0.06) this.say(U.pick(CFG.driverLines));
      }
    } else if (this.state === 'proc') {
      this.v = 0;
    } else if (this.state === 'leave') {
      this.moveTo(CFG.despawnX + 10, dt, CFG.roadSpeed * 1.2, 5);
      if (this.x > CFG.despawnX) { this.destroy(); return; }
    }
    // visuals
    this.group.position.x = this.x;
    for (const w of this.model.wheels) w.mesh.rotation.z -= (this.v * dt) / w.r;
    this.bounce = U.damp(this.bounce, 0, 6, dt);
    const sq = Math.sin(this.t * 22) * this.bounce * 0.06;
    this.model.inner.scale.set(1 + sq * 0.5, 1 - sq, 1 + sq * 0.5);
    this.model.inner.rotation.z = -U.clamp(this.v - (this.prevV || 0), -2, 2) * 0.02;
    this.prevV = this.v;
    if (this.model.extras.hover) this.model.extras.hover.position.y = 1.25 + Math.sin(this.t * 3) * 0.12;
    if (this.model.extras.siren) { const on = Math.floor(this.t * 6) % 2; this.model.extras.siren[0].visible = !!on; this.model.extras.siren[1].visible = !on; }
    if (this.model.extras.lights) this.model.extras.lights.forEach((l, i) => { l.visible = (Math.floor(this.t * 8) + i) % 2 === 0; });
    if (this.flies) this.flies.children.forEach((f, i) => { const a = this.t * (5 + i) + i * 2; f.position.set(Math.cos(a) * 0.9, Math.sin(a * 1.7) * 0.3, Math.sin(a) * 0.7); });
    if (this.sayLbl) { this.sayT -= dt; if (this.sayT <= 0) { this.sayLbl.remove(); this.sayLbl = null; } }
    this.updateLabel();
  }
  honk() {
    const type = this.type;
    if (type === 'duck') Sfx.play.quack(); else if (type === 'police') Sfx.play.siren(); else if (type === 'icecream') Sfx.play.jingle(); else Sfx.play.honk(this.def.honky ? 1.1 : 1);
    if (Game.player.near(this.x, this.z, 30)) FX.text(new THREE.Vector3(this.x, this.model.h + 0.5, this.z), type === 'duck' ? 'QUACK!' : 'HONK!', 'honk', { dur: 0.9, rise: 40 });
    this.bounce = 0.8;
  }
  say(text) {
    if (this.sayLbl) return;
    this.sayLbl = FX.label(this.group, this.model.h + 1.55, `<div class="say">${text}</div>`, '');
    this.sayT = 3.2;
  }
  face() {
    if (this.state === 'leave') return this.mood === 'love' ? 'love' : this.mood === 'meh' ? 'meh' : 'happy';
    const p = this.patience / this.patMax;
    if (!this.waiting) return this.waited > 8 ? 'meh' : 'happy';
    return p > 0.6 ? 'happy' : p > 0.3 ? 'meh' : 'angry';
  }
  updateLabel(force) {
    const f = this.face();
    const p = U.clamp(this.patience / this.patMax, 0, 1);
    const showBar = this.waiting && p < 0.75 && this.x > CFG.entranceX - 45;
    const key = f + (showBar ? Math.round(p * 20) : 'x');
    if (!force && key === this._lk) return;
    this._lk = key;
    const col = p > 0.6 ? '#46c23a' : p > 0.3 ? '#ffc93c' : '#ff4d5a';
    const showFace = !this.waiting || this.x > CFG.entranceX - 45;
    this.label.set(showFace ? `<div class="mood"><div class="face">${ICONS.html(f)}</div>${showBar ? `<div class="pbar"><div style="width:${(p * 100).toFixed(0)}%;background:${col}"></div></div>` : ''}</div>` : '');
  }
  enteredLine() {
    const g = this.lane.entrance; if (!g) return;
    g.lamp.material.color.set(0xff4d4d);
    setTimeout(() => g.lamp.material.color.set(0x3dff6a), 900);
  }
  onProcessed(station) {
    this.state = 'drive'; this.doneX = station.x; this.stop = null;
    if (station.occupant === this) station.occupant = null;
    this.waited = 0;
    if (station.type !== 'pay') { this.bill += Game.stationValue(station.type); this.stages++; }
  }
  leave() {
    this.state = 'leave';
    const clean = this.dirt < 0.05;
    this.mood = clean && this.stages >= 3 ? 'love' : clean ? 'happy' : 'meh';
    this.updateLabel(true);
    if (this.goldLbl) { this.goldLbl.remove(); this.goldLbl = null; }
    // funny: a pigeon sometimes ruins a freshly cleaned car on its way out
    if (clean && Math.random() < 0.05) {
      setTimeout(() => {
        if (!this.group.parent) return;
        const pos = new THREE.Vector3(0, this.model.h + 0.02, 0);
        const it = FX.sys.mud.add(this.model.inner, pos, new THREE.Quaternion(), new THREE.Vector3(0.35, 0.06, 0.3), 0xffffff);
        if (it) this.mud.push(it);
        FX.text(new THREE.Vector3(this.x, this.model.h + 0.8, this.z), 'SPLAT! NOOO!', 'rage', { dur: 1.1 });
        Sfx.play.splat();
      }, 900);
    }
  }
  rageQuit() {
    FX.smoke(this.x, 1, this.z, 16, 1.2); Sfx.play.rage();
    FX.text(new THREE.Vector3(this.x, 2.6, this.z), U.pick(CFG.ragePuns), 'rage', { dur: 1.4 });
    Bus.emit('car:rage', this);
    this.destroy();
  }
  destroy() {
    this.dead = true;
    const i = this.lane.cars.indexOf(this); if (i >= 0) this.lane.cars.splice(i, 1);
    for (const st of Object.values(this.lane.stations)) if (st.occupant === this) st.occupant = null;
    FX.sys.mud.removeAll(this.model.inner); if (this.model.extras.hover) FX.sys.mud.removeAll(this.model.extras.hover);
    FX.sys.coat.removeAll(this.model.inner); if (this.model.extras.hover) FX.sys.coat.removeAll(this.model.extras.hover);
    GFX.scene.remove(this.group);
    this.label.remove(); if (this.sayLbl) this.sayLbl.remove(); if (this.goldLbl) this.goldLbl.remove();
    this.model.paintMat.dispose();
    Game.removeCar(this);
  }
}

</script>
<script>
// ---- js/stations.js ----
// stations.js — wash stations, hoppers, supply racks, cash piles, build pads, lanes and buildings.

const MatDecal = (() => {
  const cache = {};
  function tex(icon, col) {
    const key = icon + col;
    return cache[key] || (cache[key] = TEX.make(256, 256, (ctx, w, h) => {
      ctx.clearRect(0, 0, w, h);
      TEX.rr(ctx, 12, 12, w - 24, h - 24, 40); ctx.fillStyle = col; ctx.globalAlpha = 0.55; ctx.fill(); ctx.globalAlpha = 1;
      ctx.lineWidth = 12; ctx.strokeStyle = '#ffffff'; TEX.rr(ctx, 18, 18, w - 36, h - 36, 34); ctx.stroke();
      TEX.icon(ctx, icon, w / 2, h / 2, 130);
    }, 'mat|' + key));
  }
  return function (icon, col = '#2563eb', size = 1.7) {
    const m = new THREE.Mesh(GEO.plane(size, size), new THREE.MeshBasicMaterial({ map: tex(icon, col), transparent: true, depthWrite: false }));
    m.rotation.x = -Math.PI / 2; m.renderOrder = 1;
    return m;
  };
})();

function popIn(obj, delay = 0, from = 0.01) {
  obj.scale.setScalar(from);
  const t0 = performance.now() + delay * 1000;
  const step = () => {
    const t = (performance.now() - t0) / 450;
    if (t < 0) { requestAnimationFrame(step); return; }
    obj.scale.setScalar(t >= 1 ? 1 : Math.max(0.01, U.easeOutBack(t)));
    if (t < 1) requestAnimationFrame(step);
  };
  requestAnimationFrame(step);
}

// ---------------------------------------------------------------------------
class Hopper {
  constructor(st, count) {
    this.st = st; this.supply = st.def.supply; this.cap = CFG.hopperCap;
    this.model = Models.hopper(this.supply);
    this.pos = new THREE.Vector3(st.x, 0, st.z + CFG.hopperDZ);
    this.model.group.position.copy(this.pos);
    GFX.scene.add(this.model.group);
    this.mat = { x: st.x, z: st.z + CFG.matDZ };
    this.decal = MatDecal(CFG.supplies[this.supply].icon, '#46c23a', 1.6);
    this.decal.position.set(this.mat.x, 0.05, this.mat.z); GFX.scene.add(this.decal);
    this.count = count; this.incoming = 0; this.pending = 0;
    this.lbl = FX.label(new THREE.Vector3(this.pos.x, 2.0, this.pos.z), 0, '', '');
    this.refresh();
  }
  get space() { return this.cap - this.count - this.pending; }
  receive(it) {
    this.pending++;
    const top = this.pos.clone().setY(1.7);
    FX.fly(it.mesh, it.pos, top, 0.25, 1.0, (m) => {
      if (m.parent) m.parent.remove(m);
      this.pending = Math.max(0, this.pending - 1);
      this.count = Math.min(this.cap, this.count + 1);
      this.refresh(); Sfx.play.pop();
      this.bump = 1;
    }, { spin: 6 });
  }
  consume() { this.count = Math.max(0, this.count - 1); this.refresh(); }
  refresh() {
    this.model.pips.forEach((p, i) => p.material.color.set(i < this.count ? this.model.color : 0x3a3f47));
    const low = this.count <= 1;
    this.lbl.set(this.count >= this.cap ? '' : `<div class="hopper-lbl${low ? ' low' : ''}">${ICONS.html(CFG.supplies[this.supply].icon)}${this.count}/${this.cap}</div>`);
  }
  update(dt) {
    if (this.bump) { this.bump = U.damp(this.bump, 0, 8, dt); const s = 1 + Math.sin(this.bump * 12) * this.bump * 0.06; this.model.group.scale.set(s, 1 / s, s); }
  }
  colliders() { return [{ x0: this.pos.x - 0.62, x1: this.pos.x + 0.62, z0: this.pos.z - 0.5, z1: this.pos.z + 0.5 }]; }
  destroy() { GFX.scene.remove(this.model.group); GFX.scene.remove(this.decal); this.lbl.remove(); }
}

// ---------------------------------------------------------------------------
const STATION_COLL = {
  brush: [[-1.25, -0.65, -2.5, -1.9], [-1.25, -0.65, 1.9, 2.5]],
  rinse: [[-0.42, 0.42, -2.55, -1.75], [-0.42, 0.42, 1.75, 2.55]],
  wax: [[-0.42, 0.42, -2.55, -1.75], [-0.42, 0.42, 1.75, 2.55]],
  dryer: [[-1.05, 1.05, -2.45, -1.85], [-1.05, 1.05, 1.85, 2.45]],
  tire: [[-1.3, 1.3, -2.3, -1.38], [-1.3, 1.3, 1.38, 2.3]],
  polish: [[-2.17, -1.83, -2.37, -2.03], [1.83, 2.17, -2.37, -2.03], [-2.17, -1.83, 2.03, 2.37], [1.83, 2.17, 2.03, 2.37]],
  pay: [[-1.15, 1.15, 2.05, 2.55], [-1.25, -0.78, 2.3, 3.75], [1.35, 1.75, 1.7, 2.1]],
};

class Station {
  constructor(lane, type) {
    this.lane = lane; this.type = type; this.def = CFG.stations[type];
    this.x = CFG.slotX[type]; this.z = lane.z;
    this.group = new THREE.Group(); this.group.position.set(this.x, 0, this.z);
    GFX.scene.add(this.group);
    if (type !== 'pay') {
      const fb = new Builder(); Models.stationFloor(fb, 0, 0);
      const floor = fb.build(MAT.vc, false); floor.receiveShadow = true; floor.userData.noTint = true; this.group.add(floor);
      this.machine = Models.machine(type); this.group.add(this.machine.group);
    } else {
      this.booth = Models.payBooth(); this.booth.group.position.set(0, 0, CFG.boothDZ); this.group.add(this.booth.group);
      this.barrierT = 0;
    }
    if (this.def.operator) {
      this.operatorSpot = new THREE.Vector3(this.x, 0, this.z + (type === 'pay' ? CFG.cashierDZ : CFG.polishDZ));
      this.operatorFacing = Math.PI;
      this.opDecal = MatDecal(type === 'pay' ? 'pay' : 'polish', '#ff8a1f', 1.3);
      this.opDecal.position.set(this.operatorSpot.x, 0.06, this.operatorSpot.z); GFX.scene.add(this.opDecal);
    }
    this.hopper = null;
    this.occupant = null; this.car = null; this.busy = false; this.t = 0; this.dur = 1; this.fxT = 0;
    this.block = null; this.blockT = 0;
    this.badge = FX.label(new THREE.Vector3(this.x, type === 'pay' ? 3.9 : 5.2, this.z + (type === 'pay' ? CFG.boothDZ : 0)), 0, '', '');
    this.prog = FX.label(new THREE.Vector3(this.x, type === 'pay' ? 3.4 : 4.6, this.z + (type === 'pay' ? CFG.boothDZ : 0)), 0, '', '');
    this.lastProg = -1;
    // own material so upgrades can repaint this machine (tiers at Lv 10 / 20 / 30)
    this.mat = MAT.vc.clone();
    this.group.traverse(o => { if (o.isMesh && o.material === MAT.vc && !o.userData.noTint) o.material = this.mat; });
    this.tier = -1; this.applyTier();
  }
  applyTier() {
    const l = Game.lv(this.type), tier = l >= 30 ? 3 : l >= 20 ? 2 : l >= 10 ? 1 : 0;
    if (tier === this.tier) return false;
    const first = this.tier < 0;
    this.tier = tier;
    this.mat.color.set([0xffffff, 0xd8f1ff, 0xeadcff, 0xffe39a][tier]);
    if (!first && tier > 0) { FX.confetti(this.x, 4, this.z, 40, 6); FX.text(new THREE.Vector3(this.x, 5.4, this.z), ['', 'FROSTY PAINT!', 'ROYAL PAINT!', 'SOLID GOLD!'][tier], 'new', { dur: 1.5 }); }
    return true;
  }
  makeHopper(count) { if (this.def.supply) this.hopper = new Hopper(this, count); }
  colliders() {
    const out = (STATION_COLL[this.type] || []).map(([a, b, c, d]) => ({ x0: this.x + a, x1: this.x + b, z0: this.z + c, z1: this.z + d }));
    if (this.hopper) out.push(...this.hopper.colliders());
    return out;
  }
  operatorPresent() {
    const p = Game.player;
    if (p.near(this.operatorSpot.x, this.operatorSpot.z, 1.15)) return 'player';
    const w = Game.workers.find(w => w.post === this && w.atPost && !w.napping);
    return w ? 'worker' : null;
  }
  tryStart(car) {
    if (this.def.supply && this.hopper.count <= 0) { this.setBlock('supply'); return false; }
    if (this.def.operator && !this.operatorPresent()) { this.setBlock('staff'); return false; }
    this.setBlock(null);
    if (this.hopper) this.hopper.consume();
    this.busy = true; this.car = car; this.t = 0; this.fxT = 0;
    this.dur = Game.stationTime(this.type);
    this.onStart(car);
    return true;
  }
  setBlock(b) {
    if (b === this.block) return;
    this.block = b;
    if (!b) { this.badge.set(''); return; }
    if (b === 'supply') this.badge.set(`<div class="st-badge">${ICONS.html(CFG.supplies[this.def.supply].icon)}NO ${CFG.supplies[this.def.supply].name.toUpperCase()}!</div>`);
    else this.badge.set(`<div class="st-badge warn">${ICONS.html('hand')}${this.type === 'pay' ? 'NEED CASHIER' : 'NEED POLISHER'}</div>`);
  }
  onStart(car) {
    const T = this.type;
    if (T === 'brush') { car.addFoam(); Sfx.play.scrub(); }
    else if (T === 'rinse') Sfx.play.spray();
    else if (T === 'dryer') Sfx.play.fan();
    else if (T === 'wax') Sfx.play.bubble();
  }
  update(dt) {
    if (this.machine && this.machine.anim.update) this.machine.anim.update(dt, this.busy);
    if (this.type === 'pay') {
      this.barrierT = Math.max(0, this.barrierT - dt);
      const want = this.barrierT > 0 ? 1.35 : 0;
      this.booth.barrier.rotation.x = U.damp(this.booth.barrier.rotation.x, want, 9, dt);
    }
    if (this.hopper) this.hopper.update(dt);
    if (!this.busy) {
      if (this.prog.html) { this.prog.set(''); this.lastProg = -1; }
      // a blocked car sits here: keep the badge, otherwise clear it
      if (this.block && !(this.occupant && this.occupant.state === 'drive')) this.setBlock(null);
      return;
    }
    // operator stations only run while someone is there
    if (this.def.operator && !this.operatorPresent()) { this.setBlock('staff'); return; }
    if (this.def.operator) this.setBlock(null);
    this.t += dt;
    this.fxT -= dt;
    const car = this.car, k = this.t / this.dur;
    this.stageFx(car, k, dt);
    const pr = Math.round(k * 20);
    if (pr !== this.lastProg) {
      this.lastProg = pr;
      const c = 2 * Math.PI * 15;
      this.prog.set(`<svg class="ring-prog" viewBox="0 0 40 40"><circle cx="20" cy="20" r="15" fill="rgba(12,24,44,.55)" stroke="rgba(255,255,255,.35)" stroke-width="5"/><circle cx="20" cy="20" r="15" fill="none" stroke="#46c23a" stroke-width="5" stroke-linecap="round" stroke-dasharray="${(c * Math.min(1, k)).toFixed(1)} ${c.toFixed(1)}" transform="rotate(-90 20 20)"/></svg>`);
    }
    if (this.t >= this.dur) this.finish();
  }
  stageFx(car, k, dt) {
    const x = this.x, z = this.z, T = this.type;
    if (T === 'brush') {
      if (this.fxT <= 0) {
        this.fxT = 0.07;
        FX.foamBurst(x + U.rand(-1.4, 1.4), U.rand(0.5, 1.8), z + (Math.random() < 0.5 ? -1 : 1) * U.rand(0.9, 1.4), 2, 0.25);
        if (Math.random() < 0.3) FX.bubbles(x, 2, z, 1);
        if (Math.random() < 0.15) Sfx.play.scrub();
      }
      car.setMud(U.lerp(1, 0.45, k));
      car.dirt = Math.min(car.dirt, U.lerp(1, 0.5, k)); car.dustTint();
    } else if (T === 'rinse') {
      if (this.fxT <= 0) { this.fxT = 0.05; FX.rain(x, z, 0.4, 1.7, 3); if (Math.random() < 0.5) FX.splash(x + U.rand(-1, 1), 0.1, z + U.rand(-1.5, 1.5), 3, 1.5); if (Math.random() < 0.08) Sfx.play.splash(); }
      if (k > 0.3 && car.coat.length) car.clearFoam();
      car.setMud(U.lerp(0.45, 0, U.clamp((k - 0.2) / 0.6, 0, 1)));
      car.dirt = Math.min(car.dirt, U.lerp(0.5, 0, k)); car.dustTint();
      if (car.flies && k > 0.5) { car.group.remove(car.flies); car.flies = null; }
      if (k > 0.5 && car.model.extras.washMe.visible) car.model.extras.washMe.visible = false;
    } else if (T === 'wax') {
      if (this.fxT <= 0) { this.fxT = 0.08; FX.foamBurst(x + U.rand(-1.2, 1.2), U.rand(0.9, 1.9), z + U.rand(-0.9, 0.9), 2, 0.3, [0xff6fb1, 0xffd23f, 0x4fa3ff]); }
      car.shine = Math.max(car.shine, k * 0.5); car.dustTint();
    } else if (T === 'dryer') {
      if (this.fxT <= 0) { this.fxT = 0.05; FX.wind(x, z, 0.9, 1.4, 2); if (k > 0.6 && Math.random() < 0.4) FX.sparkles(x, 1.6, z, 1, 1.4); }
      car.shine = Math.max(car.shine, 0.5 + k * 0.3); car.dustTint();
    } else if (T === 'tire') {
      if (this.fxT <= 0) { this.fxT = 0.12; for (const w of car.model.wheels) { const wp = new THREE.Vector3(); w.mesh.getWorldPosition(wp); if (Math.random() < 0.5) FX.sparkles(wp.x, 0.3, wp.z, 1, 0.2); } }
    } else if (T === 'polish') {
      if (this.fxT <= 0) { this.fxT = 0.1; FX.sparkles(x + U.rand(-1.5, 1.5), U.rand(0.8, 1.8), z + U.rand(-0.9, 0.9), 1, 0.3); if (Math.random() < 0.2) Sfx.play.scrub(); }
      car.shine = Math.max(car.shine, 0.8 + k * 0.2); car.dustTint();
    }
  }
  finish() {
    const car = this.car, T = this.type;
    this.busy = false; this.car = null;
    this.prog.set(''); this.lastProg = -1;
    if (T === 'rinse') { car.clearFoam(); car.setMud(0); car.dirt = 0; car.dustTint(); }
    if (T === 'brush') car.setMud(0.45);
    if (T === 'dryer' || T === 'polish') FX.sparkles(this.x, 1.5, this.z, T === 'polish' ? 10 : 5, 1.6);
    if (T === 'polish') { Sfx.play.squeak(); FX.text(new THREE.Vector3(this.x, car.model.h + 1.0, this.z), 'SO SHINY!', 'big', { dur: 1.1 }); }
    car.onProcessed(this);
    if (T === 'pay') { this.barrierT = 1.4; Game.payout(this, car); }
    Bus.emit('station:done', { st: this, car });
  }
  destroy() {
    GFX.scene.remove(this.group); this.badge.remove(); this.prog.remove();
    if (this.opDecal) GFX.scene.remove(this.opDecal);
    if (this.hopper) this.hopper.destroy();
  }
}

// ---------------------------------------------------------------------------
class Rack {
  constructor(supply, stock) {
    this.supply = supply; this.cfg = CFG.racks[supply];
    this.model = Models.rack(supply);
    const [x, z] = CFG.racksPos[supply];
    this.pos = new THREE.Vector3(x, 0, z);
    this.model.group.position.copy(this.pos);
    GFX.scene.add(this.model.group);
    this.mat = { x: x + 0.35, z: z + CFG.rackMatDZ };
    this.decal = MatDecal(CFG.supplies[supply].icon, '#2563eb', 1.7);
    this.decal.position.set(this.mat.x, 0.05, this.mat.z); GFX.scene.add(this.decal);
    this.items = [];
    this.t = 0;
    for (let i = 0; i < Math.min(stock, this.cap); i++) this.spawnItem(false);
  }
  get lv() { return Game.ls.racks[this.supply] || 1; }
  get cap() { return Math.min(this.model.slots.length, this.cfg.cap + Math.floor((this.lv - 1) / 2)); }
  get time() { return this.cfg.time * Math.pow(0.92, this.lv - 1); }
  get stock() { return this.items.length; }
  spawnItem(anim = true) {
    const m = Models.item(this.supply);
    m.position.copy(this.model.slots[this.items.length]);
    m.rotation.y = U.rand(-0.2, 0.2);
    this.model.group.add(m);
    this.items.push(m);
    if (anim) { popIn(m); this.puff = 1; }
  }
  take() {
    if (!this.items.length) return null;
    const m = this.items.pop();
    const wp = new THREE.Vector3(); m.getWorldPosition(wp);
    this.model.group.remove(m);
    return wp;
  }
  update(dt) {
    if (this.items.length < this.cap) {
      this.t += dt;
      if (this.t >= this.time) { this.t = 0; this.spawnItem(true); }
    } else this.t = 0;
    const g = this.model.giant;
    this.puff = U.damp(this.puff || 0, 0, 6, dt);
    const s = 2.7 * (1 + Math.sin(performance.now() / 120) * 0.04 * this.puff + this.puff * 0.08);
    g.scale.set(s, 2.7 * (1 - this.puff * 0.08), s);
    g.rotation.y += dt * 0.4;
  }
  colliders() {
    const { x, z } = this.pos;
    return [{ x0: x - 2.75, x1: x - 1.15, z0: z - 0.68, z1: z + 0.68 }, { x0: x - 0.95, x1: x + 1.65, z0: z - 0.66, z1: z + 0.66 }];
  }
  destroy() { GFX.scene.remove(this.model.group); GFX.scene.remove(this.decal); }
}

// ---------------------------------------------------------------------------
// Stack of cash bundles waiting to be collected (one per pay booth, plus the vending tray).
class CashPile {
  constructor(x, z, o = {}) {
    this.pos = new THREE.Vector3(x, 0, z);
    this.group = new THREE.Group(); this.group.position.copy(this.pos); GFX.scene.add(this.group);
    this.base = o.base != null ? o.base : 0.39;
    if (!o.noTable) { this.table = Models.cashTable(); this.group.add(this.table); }
    this.inst = new THREE.InstancedMesh(Models.cashBundleGeo(), MAT.vc, 64);
    this.inst.castShadow = true; this.inst.count = 0; this.group.add(this.inst);
    this.values = [];
    this.collectT = 0; this.combo = 0; this.comboT = 0;
    this.lbl = FX.label(new THREE.Vector3(x, 1.2, z), 0, '', '');
    this.rot = Array.from({ length: 64 }, () => U.rand(-0.15, 0.15));
  }
  get total() { return this.values.reduce((a, b) => a + b, 0); }
  slot(i, out) {
    const layer = Math.floor(i / 4), j = i % 4;
    return out.set((j % 2 ? 0.31 : -0.31), this.base + layer * 0.135, (j < 2 ? -0.19 : 0.19));
  }
  redraw() {
    const m = new THREE.Matrix4(), p = new THREE.Vector3(), q = new THREE.Quaternion(), s = new THREE.Vector3(1, 1, 1);
    const n = Math.min(64, this.values.length);
    for (let i = 0; i < n; i++) { this.slot(i, p); q.setFromAxisAngle(new THREE.Vector3(0, 1, 0), this.rot[i]); m.compose(p, q, s); this.inst.setMatrixAt(i, m); }
    this.inst.count = n; this.inst.instanceMatrix.needsUpdate = true;
    const tot = this.total;
    this.lbl.set(tot > 0 ? `<div class="pile-lbl">${ICONS.html('cash')}${U.fmt(tot)}</div>` : '');
    this.lbl.anchor.y = 1.0 + Math.min(64, this.values.length) / 4 * 0.135 + 0.5;
  }
  add(amount, from, nBundles) {
    const n = nBundles || U.clamp(Math.ceil(Math.log2(1 + amount / Math.max(1, Game.basePrice()))) + 1, 2, 5);
    const each = amount / n;
    for (let i = 0; i < n; i++) {
      const b = FX.getBundle();
      const dest = new THREE.Vector3();
      setTimeout(() => {
        const idx = Math.min(63, this.values.length + i);
        this.slot(idx, dest); dest.add(this.pos);
        FX.fly(b, from.clone().add(new THREE.Vector3(U.rand(-0.3, 0.3), 0, U.rand(-0.3, 0.3))), dest, 0.35, 1.6, () => {
          FX.freeBundle(b);
          if (this.values.length >= 64) this.values[U.randi(0, 63)] += each; else this.values.push(each);
          this.redraw(); Sfx.play.tick();
        }, { spin: 4 });
      }, i * 70);
    }
  }
  restore(total) { if (total > 0) { const n = U.clamp(Math.round(total / Math.max(1, Game.basePrice() * 2)), 1, 24); for (let i = 0; i < n; i++) this.values.push(total / n); this.redraw(); } }
  update(dt) {
    this.comboT -= dt; if (this.comboT <= 0) this.combo = 0;
    if (!this.values.length) return;
    const p = Game.player;
    if (!p.near(this.pos.x, this.pos.z, Game.magnet())) return;
    this.collectT -= dt;
    while (this.collectT <= 0 && this.values.length) {
      this.collectT += 0.035;
      const i = this.values.length - 1, v = this.values.pop();
      const from = new THREE.Vector3(); this.slot(Math.min(63, i), from); from.add(this.pos);
      const b = FX.getBundle();
      const c = this.combo++; this.comboT = 0.6;
      FX.fly(b, from, () => p.pos.clone().setY(1.3), 0.22, 0.9, () => { FX.freeBundle(b); Game.addCash(v, null, { silent: true }); Sfx.play.coin(c * 0.5); }, { scaleTo: 0.4 });
      if (c === 0) Game.cnt('collect');
      this.redraw();
      if (!this.values.length) { Bus.emit('cash:collected', this); U.vibrate(10); }
    }
  }
  destroy() { GFX.scene.remove(this.group); this.lbl.remove(); }
}

// ---------------------------------------------------------------------------
class Pad {
  constructor(def, M, paid) {
    this.def = def; this.id = def.id;
    this.cost = Math.round(def.cost * M);
    this.paid = Math.min(paid || 0, this.cost - 1);
    const p = Game.padPos(def);
    this.pos = new THREE.Vector3(p[0], 0, p[1]);
    this.canvas = document.createElement('canvas'); this.canvas.width = this.canvas.height = 256;
    this.ctx = this.canvas.getContext('2d');
    this.tex = new THREE.CanvasTexture(this.canvas);
    this.icon = Game.padIcon(def);
    this.mesh = new THREE.Mesh(GEO.plane(2.8, 2.8), new THREE.MeshBasicMaterial({ map: this.tex, transparent: true, depthWrite: false }));
    this.mesh.rotation.x = -Math.PI / 2; this.mesh.position.set(this.pos.x, 0.07, this.pos.z); this.mesh.renderOrder = 2;
    this.name = FX.label(new THREE.Vector3(this.pos.x, 0.2, this.pos.z + 1.75), 0, `<div class="mat-lbl">${Game.padName(def)}</div>`, '');
    this.name.show(false);
    this.shown = false; this.tick = 0; this.dirty = true; this.payT = 0; this.coinN = 0; this.hintT = 0;
    this.draw();
  }
  get remaining() { return Math.max(0, this.cost - this.paid); }
  draw() { Models.drawPad(this.ctx, 256, 256, { icon: this.icon }, this.remaining, this.cost); this.tex.needsUpdate = true; this.dirty = false; }
  show(anim = true) {
    if (this.shown) return;
    this.shown = true; GFX.scene.add(this.mesh); this.name.show(true);
    if (anim) { popIn(this.mesh, 0.3); FX.sparkles(this.pos.x, 0.5, this.pos.z, 6, 1); }
  }
  update(dt) {
    if (!this.shown) return;
    this.tick += dt;
    const pulse = 1 + Math.sin(this.tick * 4) * 0.025;
    if (this.mesh.scale.x > 0.9) this.mesh.scale.setScalar(pulse);
    const p = Game.player;
    const inside = Math.abs(p.pos.x - this.pos.x) < 1.4 && Math.abs(p.pos.z - this.pos.z) < 1.4;
    if (!inside) { this.coinN = 0; this.hintT = 0; return; }
    const S = Store.s;
    if (S.cash < 1) {
      this.hintT += dt;
      if (this.hintT > 0.5 && this.hintT - dt <= 0.5) Bus.emit('pad:broke', this);
      return;
    }
    // drain cash into the pad: always ~1.3s for a full pad
    const rate = Math.max(this.cost / 1.3, 12);
    const amt = Math.min(this.remaining, S.cash, rate * dt);
    if (amt <= 0) return;
    Game.spend(amt, true);
    this.paid += amt;
    Game.ls.paid[this.id] = this.paid;
    this.payT -= dt;
    if (this.payT <= 0) {
      this.payT = 0.07;
      const b = FX.getBundle();
      FX.fly(b, p.pos.clone().setY(1.3), this.pos.clone().setY(0.2), 0.25, 1.2, () => FX.freeBundle(b), { scaleTo: 0.5 });
      Sfx.play.coin(Math.min(20, this.coinN++ * 0.6));
      this.draw();
    }
    if (this.remaining <= 0.5) { this.paid = this.cost; this.draw(); Game.completePad(this); }
  }
  hide() { GFX.scene.remove(this.mesh); this.name.remove(); this.shown = false; }
}

// ---------------------------------------------------------------------------
class Lane {
  constructor(idx) {
    this.idx = idx; this.z = CFG.laneZ[idx];
    this.stations = {}; this.cars = [];
    this.unlocked = false; this.entrance = null; this.exit = null; this.pile = null;
  }
  unlock(anim) {
    if (this.unlocked) return;
    this.unlocked = true;
    this.entrance = Models.gate('ENTRANCE'); this.entrance.group.position.set(CFG.entranceX, 0, this.z); GFX.scene.add(this.entrance.group);
    this.exit = Models.gate('EXIT'); this.exit.group.position.set(CFG.exitX, 0, this.z); GFX.scene.add(this.exit.group);
    this.pile = new CashPile(CFG.slotX.pay + CFG.cashDX, this.z + CFG.cashDZ);
    if (this.idx > 0) World.openLane2();
    if (anim) { popIn(this.entrance.group, 0.1); popIn(this.exit.group, 0.25); }
  }
  addStation(type, anim, hopperCount) {
    const st = new Station(this, type);
    st.makeHopper(hopperCount != null ? hopperCount : 3);
    this.stations[type] = st;
    if (anim) { popIn(st.group); if (st.hopper) popIn(st.hopper.model.group, 0.15); }
    this._stops = null;
    return st;
  }
  get queue() { return this.cars.filter(c => c.waiting); }
  stops() { return this._stops || (this._stops = CFG.slotOrder.map(t => this.stations[t]).filter(Boolean)); }
  firstStop() { return this.stops()[0] || null; }
  nextStop(st) { const s = this.stops(); const i = s.indexOf(st); return i >= 0 ? s[i + 1] || null : null; }
  colliders() {
    const out = [];
    for (const st of Object.values(this.stations)) out.push(...st.colliders());
    if (this.unlocked) {
      for (const gx of [CFG.entranceX, CFG.exitX]) for (const sz of [-1, 1]) out.push({ x0: gx - 0.36, x1: gx + 0.36, z0: this.z + sz * 2.35 - 0.36, z1: this.z + sz * 2.35 + 0.36 });
      const px = CFG.slotX.pay + CFG.cashDX, pz = this.z + CFG.cashDZ;
      out.push({ x0: px - 0.85, x1: px + 0.85, z0: pz - 0.62, z1: pz + 0.62 });
    }
    return out;
  }
  destroy() {
    for (const st of Object.values(this.stations)) st.destroy();
    if (this.entrance) GFX.scene.remove(this.entrance.group);
    if (this.exit) GFX.scene.remove(this.exit.group);
    if (this.pile) this.pile.destroy();
  }
}

// ---------------------------------------------------------------------------
// Buildings and decorations bought with pads.
class Building {
  constructor(id, anim, theme) {
    this.id = id;
    const cfg = CFG.buildings[id];
    this.pos = new THREE.Vector3(cfg.pos[0], 0, cfg.pos[1]);
    let g, coll = [];
    const P = this.pos;
    const box = (hx, hz, ox = 0, oz = 0) => coll.push({ x0: P.x + ox - hx, x1: P.x + ox + hx, z0: P.z + oz - hz, z1: P.z + oz + hz });
    switch (id) {
      case 'shop': { const s = Models.shop(); g = s.group; this.keeper = s.keeper; box(6.3, 3.3); break; }
      case 'staff': g = Models.staffRoom(); box(3.25, 2.55); box(1.0, 0.3, 2.0, 2.9); break;
      case 'office': g = Models.office(); box(2.75, 2.45); break;
      case 'vip': g = Models.vipLounge(); box(3.55, 2.55); break;
      case 'coffee': g = Models.coffeeMachine(); box(0.7, 0.55); break;
      case 'vending': g = Models.vending(); box(0.7, 0.5); break;
      case 'queue': g = Models.waitingArea(); box(2.4, 0.5); break;
      case 'tubeman': { const t = Models.tubeMan(theme === 'city' ? 0xff3df2 : 0xff4d5a); g = t.group; this.tm = t; box(0.55, 0.55); break; }
      case 'fountain': { const f = Models.fountain(); g = f.group; this.jetY = f.jetY; box(2.35, 2.35); break; }
      case 'billboard': g = Models.billboard(); g.rotation.y = 0.25; box(0.3, 0.3, -2.3, 0.6); box(0.3, 0.3, 2.3, -0.6); break;
      case 'flowers': {
        g = new THREE.Group();
        const spots = [[0, 0, 3.4], [-14.5, 1.4, 3.0], [3.7, 2.0, 2.6]];
        for (const [dx, dz, l] of spots) { const fb = Models.flowerBed(l); fb.position.set(dx, 0, dz); g.add(fb); box(l / 2 + 0.05, 0.62, dx, dz); }
        break;
      }
      case 'landmark': { g = Models.landmark(Game.L.landmark); box(2.3, 2.3); break; }
      case 'travel': {
        g = new THREE.Group();
        const s = Models.signBoard('ROAD TRIP', 2.4, 0.7, '#ff8a1f', '#ffffff', 'road');
        s.position.set(0, 2.3, -1.2); g.add(s);
        const b = new Builder(); b.cyl(0.08, 0.08, 2.0, 6, 0x7d8796, { x: -0.8, y: 1.0, z: -1.25 }); b.cyl(0.08, 0.08, 2.0, 6, 0x7d8796, { x: 0.8, y: 1.0, z: -1.25 }); g.add(b.build());
        box(1.0, 0.2, 0, -1.25);
        this.mat = { x: P.x, z: P.z + 0.4, panel: 'map' };
        break;
      }
    }
    this.group = g; g.position.add(this.pos); GFX.scene.add(g);
    this.coll = coll;
    if (cfg.mat) this.mat = { x: cfg.mat[0], z: cfg.mat[1], panel: { shop: 'shop', staff: 'staff', office: 'office' }[id] };
    if (this.mat) {
      const icon = { shop: 'bag', staff: 'staff', office: 'office', map: 'map' }[this.mat.panel];
      this.decal = MatDecal(icon, '#ff8a1f', 1.8); this.decal.position.set(this.mat.x, 0.06, this.mat.z); GFX.scene.add(this.decal);
      this.matLbl = FX.label(new THREE.Vector3(this.mat.x, 0.15, this.mat.z + 1.15), 0, `<div class="mat-lbl">${{ shop: 'SHOP', staff: 'STAFF', office: 'UPGRADES', map: 'MAP' }[this.mat.panel]}</div>`, '');
      this.inMat = false;
    }
    if (id === 'vending') this.tray = new CashPile(this.pos.x + 1.25, this.pos.z + 0.7, { noTable: true, base: 0.02 });
    this.t = Math.random() * 10; this.coinT = 4;
    if (anim) { popIn(g); FX.confetti(this.pos.x, 2, this.pos.z, 50, 7); }
  }
  update(dt) {
    this.t += dt;
    if (this.tm) this.tm.update(this.t);
    if (this.jetY && Math.random() < dt * 14) {
      const a = Math.random() * Math.PI * 2;
      FX.sys.water.spawn({ x: this.pos.x, y: this.jetY, z: this.pos.z, vx: Math.cos(a) * 1.5, vy: U.rand(3, 4.5), vz: Math.sin(a) * 1.5, life: 0.9, s0: 1.8, s1: 1.0, g: 9, floor: 0.6 });
    }
    if (this.tray) {
      this.tray.update(dt);
      this.coinT -= dt;
      if (this.coinT <= 0) {
        this.coinT = 6;
        const waiting = Game.lanes.reduce((a, l) => a + l.queue.length, 0);
        if (waiting > 0) {
          const v = Math.max(1, Math.round(Game.basePrice() * 0.35 * waiting));
          this.tray.add(v, this.pos.clone().setY(1.2), 1);
          if (Game.player.near(this.pos.x, this.pos.z, 25)) FX.text(this.pos.clone().setY(2.6), 'SNACK SALE!', 'tip', { dur: 1 });
        }
      }
    }
    if (this.mat) {
      const inside = Game.player.near(this.mat.x, this.mat.z, 1.0);
      if (inside && !this.inMat && Game.player.speed01 < 0.95) { this.inMat = true; Bus.emit('mat:enter', this.mat.panel); }
      else if (!inside && this.inMat && !Game.player.near(this.mat.x, this.mat.z, 1.5)) this.inMat = false;
    }
  }
  destroy() {
    GFX.scene.remove(this.group);
    if (this.decal) GFX.scene.remove(this.decal);
    if (this.matLbl) this.matLbl.remove();
    if (this.tray) this.tray.destroy();
  }
}

</script>
<script>
// ---- js/game.js ----
// game.js — the simulation: locations, economy, spawning, payouts, pads, upgrades, staff tasks, events, quests.
const Input = { x: 0, z: 0, active: false };

const Game = (() => {
  const G = {
    L: null, ls: null, locIdx: 0,
    lanes: [], racks: {}, workers: [], cars: [], pads: [], buildings: {},
    player: null, t: 0, paused: false, running: false,
    spawnT: 0, rushHour: false, rushT: 0, nextRush: 0, nextGift: 0, nextGolden: 0, goldenDue: false,
    streak: 0, polishingPlayer: false, pickT: 0, dropT: 0, balloon: null, quest: null, saveT: 0, bottleneck: null, bnT: 0,
  };
  const S = () => Store.s;
  const M = () => G.L.mult;
  const now = () => Date.now();

  // =====================================================================
  // Economy formulas (see design doc)
  // =====================================================================
  const lv = (t) => G.ls.st[t] || 1;
  const trk = (id) => G.ls.tr[id] || 0;
  const built = (id) => !!G.ls.pads[id];
  const boost = (name) => S().boosts[name] > now();

  function stationValue(t) { const l = lv(t); return CFG.stations[t].value * (1 + 0.12 * (l - 1)) * Math.pow(1.5, Math.floor(l / 10)); }
  function stationTime(t) { const l = lv(t); return Math.max(0.45, CFG.stations[t].time * Math.pow(0.95, l - 1)); }
  function stationUpCost(t) { return Math.round(CFG.stations[t].upCost * M() * Math.pow(CFG.upGrowth, lv(t) - 1)); }
  function trackCost(id) { const d = CFG.tracks[id]; return Math.round(d.cost * M() * Math.pow(d.growth, trk(id))); }
  function rackLv(s) { return G.ls.racks[s] || 1; }
  function rackCost(s) { return Math.round(CFG.racks[s].upCost * M() * Math.pow(1.22, rackLv(s) - 1)); }
  function incomeMult() {
    const s = S();
    return (1 + 0.1 * trk('mktPrice')) * (built('landmark') ? 1.25 : 1) * (1 + 0.1 * s.gemUp.sponge) * (s.perks.starter ? 1.5 : 1) * (s.perks.vip ? 2 : 1);
  }
  function priceMult() { return M() * incomeMult() * (boost('income') ? 2 : 1); }
  function basePrice() { return CFG.stations.brush.value * M(); }
  function arrivalInterval() {
    let iv = G.L.spawn * Math.pow(0.92, trk('mktArrive'));
    if (built('tubeman')) iv *= CFG.buildingFx.tubeman.arrive;
    if (built('billboard')) iv *= CFG.buildingFx.billboard.arrive;
    if (G.rushHour) iv /= 3;
    return iv;
  }
  function queueCap() { return 3 + (built('queue') ? 3 : 0) + (G.rushHour ? 2 : 0); }
  function patience(def) { return (def.pat + 4 * trk('mktPatience') + (built('queue') ? 5 : 0)) * (built('flowers') ? 1.2 : 1); }
  function tipChance() { return 0.12 + 0.05 * trk('mktTips') + (built('fountain') ? 0.1 : 0) + 0.01 * (lv('pay') - 1); }
  function vipChance() { return built('vip') ? 0.08 + 0.04 * trk('mktVip') : 0; }
  function mgrSpeed() { return 6.2 * (1 + 0.07 * trk('mgrSpeed')) * (boost('speed') ? 1.6 : 1); }
  function mgrCarry() { return 4 + trk('mgrCarry'); }
  function magnet() { return 2.3 + 0.5 * trk('mgrMagnet'); }
  function staffSpeed() { return 3.5 * (1 + 0.08 * trk('stfSpeed')) * (built('coffee') ? 1.1 : 1); }
  function staffCarry() { return 2 + trk('stfCarry'); }
  function napMul() { return Math.pow(0.85, trk('stfCoffee')) * (built('coffee') ? 0.5 : 1); }

  // rough steady-state income, used for rewards and offline earnings
  function incomePerSec(withBoost = false) {
    let total = 0;
    const lanes = G.lanes.filter(l => l.unlocked && l.stations.pay);
    const arrive = 1 / arrivalInterval();
    for (const l of lanes) {
      const stops = l.stops();
      let cycle = 0, value = 0;
      for (const st of stops) { cycle = Math.max(cycle, stationTime(st.type) + 1.5); if (st.type !== 'pay') value += stationValue(st.type); }
      const cps = Math.min(1 / Math.max(0.5, cycle), arrive / lanes.length);
      total += cps * value * 1.2;
    }
    return total * M() * incomeMult() * (withBoost && boost('income') ? 2 : 1);
  }
  function rewardFor(minutes) { return Math.round(Math.max(incomePerSec() * 60 * minutes, (8 + 10 * minutes) * M())); }

  // =====================================================================
  // Money, gems, XP
  // =====================================================================
  function addCash(v, worldPos, o = {}) {
    v = Math.max(0, v);
    const s = S(); s.cash += v; s.stats.earned += v; G.ls.earned += v; cnt('earn', v);
    UI.cashChanged(!o.silent);
  }
  function spend(v, silent) { const s = S(); s.cash = Math.max(0, s.cash - v); UI.cashChanged(false); }
  function canAfford(v) { return S().cash >= v - 1e-6; }
  function addGems(n) { S().gems += n; UI.gemsChanged(); }
  function addXP(n) {
    const s = S(); s.xp += n;
    let up = false;
    while (s.xp >= CFG.xpFor(s.level)) { s.xp -= CFG.xpFor(s.level); s.level++; up = true; levelUp(s.level); }
    UI.xpChanged(up);
  }
  function levelUp(level) {
    const gems = CFG.levelGems(level);
    addGems(gems);
    Sfx.play.levelup(); U.vibrate([20, 40, 20]);
    FX.confetti(G.player.pos.x, 2.5, G.player.pos.z, 70, 8);
    UI.levelUp(level, gems);
    Bus.emit('level', level);
  }
  function cnt(k, v = 1) { const c = G.ls.cnt || (G.ls.cnt = {}); c[k] = (c[k] || 0) + v; }

  // =====================================================================
  // Location lifecycle
  // =====================================================================
  function load(idx, o = {}) {
    unload();
    const s = S();
    G.locIdx = idx; G.L = CFG.locations[idx]; s.loc = idx;
    G.ls = Store.loc(G.L.id);
    if (!G.ls.cnt) G.ls.cnt = {};
    if (G.ls.cash != null) { s.cash = G.ls.cash; }
    World.build(G.L.theme);
    Nav.init({ x0: CFG.walkBounds.x0 - 1, x1: CFG.walkBounds.x1 + 1, z0: CFG.walkBounds.z0 - 1, z1: CFG.walkBounds.z1 + 1 });
    G.player = new Player();
    const fresh = !G.ls.started;
    G.ls.started = true;
    // lanes + stations
    G.lanes = CFG.laneZ.map((_, i) => new Lane(i));
    G.lanes[0].unlock(false);
    const hop = (li, t, dflt) => { const k = li + ':' + t; return G.ls.hoppers[k] != null ? G.ls.hoppers[k] : dflt; };
    G.lanes[0].addStation('brush', false, hop(0, 'brush', fresh && idx === 0 ? 0 : 4));
    G.lanes[0].addStation('pay', false);
    if (built('lane2')) { G.lanes[1].unlock(false); G.lanes[1].addStation('brush', false, hop(1, 'brush', 4)); G.lanes[1].addStation('pay', false); }
    for (const def of CFG.pads) if (def.kind === 'station' && built(def.id)) G.lanes[def.lane].addStation(def.st, false, hop(def.lane, def.st, 4));
    // racks
    G.racks = {};
    const stock = (s2, d) => G.ls.rackStock[s2] != null ? G.ls.rackStock[s2] : d;
    G.racks.soap = new Rack('soap', stock('soap', fresh ? 3 : 4));
    if (built('waxRack')) G.racks.wax = new Rack('wax', stock('wax', 3));
    if (built('gelRack')) G.racks.gel = new Rack('gel', stock('gel', 3));
    // buildings
    G.buildings = {};
    G.buildings.shop = new Building('shop', false, G.L.theme);
    for (const def of CFG.pads) if ((def.kind === 'building' || def.kind === 'travel') && built(def.id)) G.buildings[def.b || 'travel'] = new Building(def.b || 'travel', false, G.L.theme);
    // staff
    G.workers = [];
    for (const def of CFG.pads) if (def.kind === 'hire' && built(def.id)) hire(def, false);
    // piles
    for (const l of G.lanes) if (l.pile && G.ls.piles[l.idx]) l.pile.restore(G.ls.piles[l.idx]);
    if (G.buildings.vending && G.ls.trays.vending) G.buildings.vending.tray.restore(G.ls.trays.vending);
    // pads
    G.pads = [];
    for (const def of CFG.pads) if (!built(def.id)) G.pads.push(new Pad(def, M(), G.ls.paid[def.id]));
    revealPads(false);
    rebuildNav();
    G.cars = [];
    G.spawnT = 2.5; G.rushHour = false; G.streak = 0;
    const t = performance.now() / 1000;

  // =====================================================================
  // Payout at the pay booth
  // =====================================================================
  function payout(st, car) {
    const s = S();
    let amount = car.bill * car.def.pay * priceMult() * car.goldenMult * (G.rushHour ? 1.5 : 1);
    amount = Math.max(1, Math.round(amount));
    const clean = car.dirt < 0.05;
    let tip = 0;
    if (Math.random() < tipChance() * (clean ? 1 : 0.35)) tip = Math.max(1, Math.round(amount * U.rand(0.2, 0.5) * (1 + Math.min(G.streak, 10) * 0.1)));
    const from = new THREE.Vector3(car.x, 1.2, car.z);
    st.lane.pile.add(amount + tip, from);
    const near = G.player.near(car.x, car.z, 26);
    if (near) {
      FX.text(new THREE.Vector3(car.x, car.model.h + 1.0, car.z), `${ICONS.html('cash')} +${U.fmt(amount)}`, 'cash', { dur: 1.3 });
      if (tip) setTimeout(() => FX.text(new THREE.Vector3(car.x + 0.6, car.model.h + 0.6, car.z), `TIP +${U.fmt(tip)}`, 'tip', { dur: 1.2 }), 250);
      if (clean && car.stages >= 3 && Math.random() < 0.6) setTimeout(() => FX.text(new THREE.Vector3(car.x - 0.5, car.model.h + 1.6, car.z), U.pick(CFG.cleanWords), 'big', { dur: 1.2 }), 120);
      if (!clean && car.coat.length && Math.random() < 0.5) FX.text(new THREE.Vector3(car.x, car.model.h + 1.4, car.z), 'STILL FOAMY?!', 'honk', { dur: 1.2 });
    }
    Sfx.play.cash();
    // stats
    s.stats.cars++; G.ls.cars++; cnt('wash');
    if (tip) { s.stats.tips++; G.ls.tips++; cnt('tips'); }
    if (car.vip) { s.stats.vip++; G.ls.vip++; cnt('vip'); }
    if (st.operatorPresent() === 'player') cnt('serve');
    G.streak = clean ? G.streak + 1 : 0;
    UI.streak(G.streak);
    addXP((1 + car.stages) * (car.vip ? 3 : 1) * (car.golden ? 5 : 1));
    // album
    const first = !s.album[car.type];
    s.album[car.type] = (s.album[car.type] || 0) + 1;
    if (first && s.level >= 1) { addGems(3); setTimeout(() => UI.toast(`New car for your album: ${car.def.name}! +3 gems`, 'album'), 400); }
    Bus.emit('car:paid', { car, amount, tip });
  }

  // =====================================================================
  // Spawning
  // =====================================================================
  function pickCarType() {
    if (G.goldenDue) { G.goldenDue = false; return 'golden'; }
    if (Math.random() < vipChance()) return U.pick(['limo', 'sports', 'monster']);
    const w = G.L.cars;
    return U.weighted(Object.keys(w), k => w[k]);
  }
  function spawnUpdate(dt) {
    G.spawnT -= dt;
    if (G.spawnT > 0) return;
    const lanes = G.lanes.filter(l => l.unlocked && l.stations.pay);
    // lane 2 works as overflow: cars pick the shortest queue, ties go to the better-equipped lane
    let best = null, bestScore = Infinity;
    for (const l of lanes) { if (l.queue.length >= queueCap()) continue; const sc = l.queue.length * 10 - l.stops().length; if (sc < bestScore) { bestScore = sc; best = l; } }
    if (!best) { G.spawnT = 0.8; return; }
    const iv = arrivalInterval();
    G.spawnT = iv * U.rand(0.75, 1.25);
    const type = pickCarType();
    const back = best.cars[best.cars.length - 1];
    const car = new Car(type, best, { x: back ? Math.min(CFG.spawnX, back.x - 6) : CFG.spawnX });
    best.cars.push(car); G.cars.push(car);
    if (type === 'golden') { UI.goldenOffer(car); }
  }

  // =====================================================================
  // Stockers pick the most urgent hopper
  // =====================================================================
  function allHoppers() { const out = []; for (const l of G.lanes) for (const st of Object.values(l.stations)) if (st.hopper) out.push(st.hopper); return out; }
  function pickStockTask(w) {
    let best = null, bestS = -Infinity;
    for (const h of allHoppers()) {
      const r = G.racks[h.supply]; if (!r) continue;
      const need = h.cap - h.count - h.incoming - h.pending;
      if (need < 2 && !(h.count === 0 && need >= 1)) continue;
      const carrying = w.stack.countOf(h.supply);
      const amount = Math.min(need, Math.max(carrying, w.stack.cap - w.stack.count + carrying));
      if (amount <= 0) continue;
      const urg = (h.cap - h.count) / h.cap;
      const d = U.dist(w.pos.x, w.pos.z, r.mat.x, r.mat.z) + U.dist(r.mat.x, r.mat.z, h.mat.x, h.mat.z);
      const sc = urg * 30 + (h.count === 0 ? 25 : 0) - d * 0.5 + (carrying ? 25 : 0) + (r.stock > 0 ? 6 : 0);
      if (sc > bestS) { bestS = sc; best = { hopper: h, rack: r, supply: h.supply, amount }; }
    }
    return best;
  }

  // =====================================================================
  // Player <-> world interactions (pickup, delivery)
  // =====================================================================
  function playerInteract(dt) {
    const p = G.player;
    G.pickT -= dt; G.dropT -= dt;
    for (const k in G.racks) {
      const r = G.racks[k];
      if (!p.near(r.mat.x, r.mat.z, 1.1)) continue;
      if (G.pickT <= 0 && !p.stack.full && r.stock > 0) {
        const wp = r.take(); if (wp) { p.stack.add(k, wp); Sfx.play.pop(); cnt('pickup'); G.pickT = 0.09; }
      }
    }
    for (const h of allHoppers()) {
      if (!p.near(h.mat.x, h.mat.z, 1.1)) continue;
      if (G.dropT <= 0 && p.stack.countOf(h.supply) > 0 && h.space > 0) {
        const it = p.stack.take(h.supply); h.receive(it); cnt('deliver'); G.dropT = 0.08;
      }
    }
    G.polishingPlayer = false;
    for (const l of G.lanes) { const st = l.stations.polish; if (st && st.busy && p.near(st.operatorSpot.x, st.operatorSpot.z, 1.15)) { G.polishingPlayer = true; p.facing = U.angleLerp(p.facing, Math.PI, 0.2); } }
  }
